      type: object
      additionalProperties: false
      required: [itemId, itemType, status, ticketId, sourceTicketVersion, sourceQueueCode, targetQueueCode, attemptCount, retryable]
      properties:
        itemId:
          type: string
          pattern: '^SQMPI-[A-Za-z0-9_-]{8,64}$'
        itemType: { $ref: '#/components/schemas/SupportQueueMigrationItemType' }
        status: { $ref: '#/components/schemas/SupportQueueMigrationItemStatus' }
        ticketId: { $ref: '#/components/schemas/TicketIdValue' }
        sourceWorkflowTaskId:
          type: string
          maxLength: 128
        sourceTicketVersion: { type: integer, minimum: 0 }
        sourceTaskVersion: { type: integer, minimum: 0 }
        sourceQueueCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        targetQueueCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        attemptCount: { type: integer, minimum: 0 }
        retryable:
          type: boolean
          description: 只有 true 的失败项可由 retry 命令再次处理。
        resultCode:
          type: string
          maxLength: 80
          description: 脱敏成功/跳过结果码。
        errorCode:
          type: string
          maxLength: 80
          description: 脱敏失败/阻断码，不返回无权对象正文或人员身份。
        resultResourceId:
          type: string
          maxLength: 128
          description: 成功迁移事件或结果引用；重放返回同一引用。
        handoverTaskId:
          type: string
          maxLength: 128
          description: IN_PROGRESS_HANDOVER 成功创建的唯一交接待办引用；不代表交接已确认。
    SupportQueueMigrationPlan:
      type: object
      additionalProperties: false
      required: [id, sourceQueueCode, sourceQueueVersion, targetQueueCode, targetQueueVersion, scopeSummary, status, planVersion, listSnapshotAt, checklistHash, unclaimedItemCount, inProgressHandoverCount, blockedItemCount, createdByIamUserId, createdAt]
      properties:
        id: { type: string, pattern: '^SQMP-[A-Za-z0-9_-]{8,64}$' }
        sourceQueueCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        sourceQueueVersion: { type: integer, minimum: 0 }
        targetQueueCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        targetQueueVersion: { type: integer, minimum: 0 }
        scopeSummary: { $ref: '#/components/schemas/SupportQueueScopeSummary' }
        status: { $ref: '#/components/schemas/SupportQueueMigrationPlanStatus' }
        planVersion: { type: integer, minimum: 0 }
        listSnapshotAt: { type: string, format: date-time }
        checklistHash:
          type: string
          maxLength: 128
          description: 审批与执行绑定的冻结逐项清单摘要。
        unclaimedItemCount: { type: integer, minimum: 0 }
        inProgressHandoverCount: { type: integer, minimum: 0 }
        blockedItemCount: { type: integer, minimum: 0 }
        succeededItemCount: { type: integer, minimum: 0 }
        retryableFailedItemCount: { type: integer, minimum: 0 }
        failedItemCount: { type: integer, minimum: 0 }
        createdByIamUserId: { type: string, maxLength: 128 }
        approvedByIamUserId: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        executionStartedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        auditEventId: { type: string, maxLength: 128 }
    SupportQueueMigrationPlanView:
      type: object
      additionalProperties: false
      required: [plan, items, page, pageSize, total]
      properties:
        plan: { $ref: '#/components/schemas/SupportQueueMigrationPlan' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportQueueMigrationPlanItem' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    SupportQueueMigrationPlanCreateRequest:
      type: object
      additionalProperties: false
      required: [sourceQueueExpectedVersion, targetQueueCode, targetQueueExpectedVersion, reason]
      properties:
        sourceQueueExpectedVersion: { type: integer, minimum: 0 }
        targetQueueCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        targetQueueExpectedVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 4, maxLength: 500 }
        effectiveAt: { type: string, format: date-time }
    SupportQueueMigrationPlanCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedPlanVersion, reason]
      properties:
        expectedPlanVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 4, maxLength: 500 }
    SupportQueueIdempotencyExecutionStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, RETRYABLE_FAILED, FAILED, LEGACY_RESULT_ONLY, RECONCILIATION_REQUIRED, FAILED_FINAL]
    SupportQueueIdempotencyRetryAdvice:
      type: string
      description: |
        WAIT_AND_QUERY=继续用原 key 查询；REPLAY_SAME_REQUEST/RETRY_SAME_KEY=仅按服务端明确建议用原 key；USE_EXISTING_RESULT=使用已验证结果；
        REQUEST_MANUAL_RECONCILIATION=不得重试并提交人工对账；FINAL_FAILURE_NEW_INTENT_REQUIRES_CONFIRMATION=原意图最终失败，只有用户明确新业务意图后才可新 key；
        DO_NOT_RETRY_CONTACT_ADMIN=关闭式停止并联系有权人员。任何值都不允许客户端自动换 key 重试不确定结果。
      enum: [WAIT_AND_QUERY, REPLAY_SAME_REQUEST, RETRY_SAME_KEY, USE_EXISTING_RESULT, REQUEST_MANUAL_RECONCILIATION, FINAL_FAILURE_NEW_INTENT_REQUIRES_CONFIRMATION, DO_NOT_RETRY_CONTACT_ADMIN]
    SupportQueueIdempotencyStatus:
      type: object
      additionalProperties: false
      description: 客户端安全状态摘要；服务端内部 HMAC、规范化请求指纹、keyVersion、租约令牌和执行节点标识不得加入该响应。
      required: [status, operation, resourceType, receivedAt, retryAdvice]
      properties:
        status: { $ref: '#/components/schemas/SupportQueueIdempotencyExecutionStatus' }
        operation:
          type: string
          maxLength: 100
          description: 规范化队列命令名称，例如 CREATE_QUEUE、EXECUTE_MIGRATION_PLAN。
        resourceType:
          type: string
          enum: [SUPPORT_QUEUE, SUPPORT_QUEUE_MIGRATION_PLAN]
        resourceId:
          type: string
          maxLength: 128
          description: 首次请求已安全确定的队列编码或计划 ID；尚未创建时可省略。
        receivedAt: { type: string, format: date-time }
        heartbeatAt: { type: string, format: date-time }
        leaseExpiresAt:
          type: string
          format: date-time
          description: 仅用于客户端决定继续等待/查询，不授予接管或执行权。
        resultResourceRef:
          type: string
          maxLength: 256
          description: 已完成业务结果的服务端安全引用；不包含内部存储路径、租约或密钥材料。
        retryAdvice: { $ref: '#/components/schemas/SupportQueueIdempotencyRetryAdvice' }
        errorCode:
          type: string
          maxLength: 80
          description: 脱敏错误码；不返回 HMAC、指纹、keyVersion、节点或请求正文。
    SupportQueueIdempotencyReconciliationDecision:
      type: string
      enum: [RESULT_CONFIRMED, FINAL_FAILURE]
    SupportQueueIdempotencyReconciliationStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED]
    SupportQueueIdempotencyReconciliationRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliationDecision' }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        resultResourceRef:
          type: string
          maxLength: 256
          description: RESULT_CONFIRMED 时提交的受控既有结果引用；服务端必须重新验证主体、资源、自然键和审计关联。
        evidenceReferences:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 仅接受服务端受管审计/业务证据 ID，不接受 URL、路径、正文或客户端 HMAC。
          items: { type: string, maxLength: 128 }
    SupportQueueIdempotencyReconciliationApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason: { type: string, minLength: 10, maxLength: 1000 }
    SupportQueueIdempotencyReconciliation:
      type: object
      additionalProperties: false
      required: [id, status, proposedDecision, applicantIamUserId, reason, version, createdAt, resultingIdempotencyStatus]
      properties:
        id: { type: string, pattern: '^SQIR-[A-Za-z0-9_-]{8,64}$' }
        status: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliationStatus' }
        proposedDecision: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliationDecision' }
        applicantIamUserId: { type: string, maxLength: 128 }
        approverIamUserId: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 1000 }
        decisionReason: { type: string, maxLength: 1000 }
        resultResourceRef:
          type: string
          maxLength: 256
          description: 仅 RESULT_CONFIRMED 且证据验证通过时返回的安全引用。
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        resultingIdempotencyStatus:
          type: string
          enum: [LEGACY_RESULT_ONLY, RECONCILIATION_REQUIRED, FAILED_FINAL]
        auditEventId: { type: string, maxLength: 128 }
    TicketAction:
      type: string
      description: 生命周期动作；动作后的状态、优先级、队列、审批和 SLA 均由服务端规则计算。
      enum: [SUBMIT, CLASSIFY, ASSIGN, ACCEPT, START_PROCESSING, REQUEST_USER_FEEDBACK, RESOLVE, CLOSE, REOPEN, CANCEL, HOLD, RESUME, ESCALATE]
    TicketWorkAction:
      type: string
      description: 多人处理动作；目标人员仅是候选输入，不构成授权或直接受让。
      enum: [TRANSFER, ADD_COLLABORATOR, REMOVE_COLLABORATOR, CLAIM, APPOINT_PRIMARY, HANDOVER_SHIFT, REQUEST_COUNTERSIGN]
    WorkflowTaskAction:
      type: string
      description: |
        仅对当前活动 Flowable 用户任务生效。CLAIM/RELEASE 处理候选任务的受让，DELEGATE 是受控委派，
        ADD/REMOVE_COUNTERSIGNER 只能按已发布会签策略增减参与人，COMPLETE/COMPLETE_COUNTERSIGN 由服务端推进 BPMN。
      enum: [CLAIM, RELEASE, COMPLETE, DELEGATE, ADD_COUNTERSIGNER, REMOVE_COUNTERSIGNER, COMPLETE_COUNTERSIGN]
    WorkflowTaskKind:
      type: string
      enum: [USER_TASK, APPROVAL_TASK, COUNTERSIGN_TASK, SERVICE_TASK_WAIT]
    WorkflowTaskAccess:
      type: string
      description: 当前主体与该任务的服务端计算关系；不是可转发的授权凭据。
      enum: [ASSIGNEE, CANDIDATE, OBSERVER]
    TicketPriority:
      type: string
      enum: [P1, P2, P3, P4]
    ServiceCatalogLifecycleStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, RETIRED, REJECTED]
    FormFieldType:
      type: string
      description: 不支持可执行脚本、HTML、任意 SQL/表达式或客户端定义组件。RICH_TEXT 仅允许服务端白名单清洗、受管图片与附件引用；CI_REFERENCE 必须走受控 CMDB/配置项选择器，不能借动态表单绕过授权。
      enum: [TEXT, LONG_TEXT, SINGLE_SELECT, MULTI_SELECT, DATETIME, BOOLEAN, TAGS, CI_REFERENCE, RICH_TEXT]
    FieldSensitivity:
      type: string
      enum: [INTERNAL, SENSITIVE]
    FieldMaskingRule:
      type: string
      description: 输出脱敏规则；是否可见和是否可填仍由服务端按数据范围、用途和流程节点决定。
      enum: [NONE, PARTIAL, FULL]
    FormConditionOperator:
      type: string
      enum: [EQUALS, NOT_EQUALS, IN, NOT_IN, HAS_VALUE, NO_VALUE]
    FormCondition:
      type: object
      additionalProperties: false
      required: [fieldCode, operator]
      properties:
        fieldCode:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: 只能引用同一已发布表单中位于当前字段之前的非敏感字段。
        operator:
          $ref: '#/components/schemas/FormConditionOperator'
        values:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 200
          description: HAS_VALUE/NO_VALUE 时省略；服务端以字典编码或规范值比对，不解释表达式。
    FormFieldValidation:
      type: object
      additionalProperties: false
      properties:
        minLength:
          type: integer
          minimum: 0
          maximum: 4000
        maxLength:
          type: integer
          minimum: 1
          maximum: 4000
        minimum:
          type: number
        maximum:
          type: number
        patternCode:
          type: string
          maxLength: 64
          description: 服务端内置、已审核的格式规则编码；不接受前端提交正则或脚本。
        allowedFileExtensions:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^\.[A-Za-z0-9]{1,10}$'
          description: 仅为受控附件字段的显示摘要；实际上传隔离、扫描和对象授权由附件接口负责。
    FormField:
      type: object
      additionalProperties: false
      required: [code, label, type, required, displayOrder, sensitivity, masking]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: 纯文本标签；服务端输出编码，前端不得以 v-html 或等价方式渲染。
        helpText:
          type: string
          maxLength: 300
          description: 纯文本帮助；不含令牌、连接串、内部路由和 HTML。
        defaultValue:
          type: string
          maxLength: 4000
          description: 非敏感字段的受控默认值；服务端按字段类型与字典重新校验，不能作为状态、人员、流程或权限的默认值。
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
        displayOrder:
          type: integer
          minimum: 1
          maximum: 500
        dictionaryCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,62}$'
          description: SELECT/RADIO/CHECKBOX_GROUP 必填；服务端验证字典已发布、字段可用性及联动后的允许值。
        validation:
          $ref: '#/components/schemas/FormFieldValidation'
        visibleWhen:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FormCondition'
          description: 所有条件同时满足才显示；联动仅支持受控比较，不支持脚本或自由表达式。
        requiredWhen:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FormCondition'
        sensitivity:
          $ref: '#/components/schemas/FieldSensitivity'
        masking:
          $ref: '#/components/schemas/FieldMaskingRule'
        allowRuleMatching:
          type: boolean
          default: false
          description: 是否允许该字段作为确定性案例匹配输入；SENSITIVE 字段默认且必须为 false，除非服务端批准例外并记录审计。
    FormData:
      type: object
      description: |
        字段键仅限指定目录表单版本的 FormField.code；服务端拒绝未知、隐藏/无权、只读、类型不符、无效字典值及未满足联动的字段。
        该开放对象只为适配受控动态表单，不能承载状态、角色、人员、组织、队列、优先级、审批、路由、SLA 或任意流程变量。
      additionalProperties: true
    TagPolicy:
      type: object
      additionalProperties: false
      required: [allowStandardTags, allowFreeTags, maxTags]
      properties:
        allowStandardTags:
          type: boolean
        allowFreeTags:
          type: boolean
        maxTags:
          type: integer
          minimum: 0
          maximum: 20
        allowedStandardTagCodes:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^TAG-[A-Za-z0-9_-]{3,60}$'
          description: 空数组表示无目录白名单；标准标签是否可用仍由服务端按当前范围决定。
    ServiceCatalogItem:
      type: object
      additionalProperties: false
      required: [id, code, name, ticketType, categoryCode, publishedVersion, formSchemaHash]
      properties:
        id:
          type: string
          pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        ticketType:
          $ref: '#/components/schemas/TicketType'
        categoryCode:
          type: string
          maxLength: 64
        publishedVersion:
          type: integer
          minimum: 1
        formSchemaHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
          description: 已发布表单定义摘要，用于前端缓存失效提示；建单仍以服务端表单版本为准。
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/StandardTag'
    ServiceCatalogItemPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogItem'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    PublishedServiceCatalogForm:
      type: object
      additionalProperties: false
      required: [serviceCatalogItem, formVersion, formSchemaHash, fields, tagPolicy]
      properties:
        serviceCatalogItem:
          $ref: '#/components/schemas/ServiceCatalogItem'
        formVersion:
          type: integer
          minimum: 1
        formSchemaHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/FormField'
        tagPolicy:
          $ref: '#/components/schemas/TagPolicy'
        publishedAt:
          type: string
          format: date-time
    DictionaryEntry:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 120
          description: 纯文本展示值；服务端输出编码，禁止使用 HTML 作为字典标签。
        parentCode:
          type: string
          maxLength: 64
        displayOrder:
          type: integer
          minimum: 1
          maximum: 100000
    DictionaryEntryPage:
      type: object
      additionalProperties: false
      required: [items, formVersion]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DictionaryEntry'
        formVersion:
          type: integer
          minimum: 1
    RuleMatchRequest:
      type: object
      additionalProperties: false
      required: [serviceCatalogItemId, formVersion, structuredFields]
      x-server-enforced:
        - published-catalog-and-form-version-check
        - dynamic-form-field-and-dictionary-validation
        - subject-data-scope-and-case-visibility
        - deterministic-rule-source-and-version
        - rate-limit-and-immutable-audit-event
      properties:
        serviceCatalogItemId:
          type: string
          pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
        formVersion:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          description: 可选的纯文本补充；服务端规范化、脱敏并仅使用已发布关键词规则，不发送至外部 AI 或向量服务。
        structuredFields:
          $ref: '#/components/schemas/FormData'
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Tag'
        relatedConfigurationItemIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
    RuleMatch:
      type: object
      additionalProperties: false
      required: [ruleCode, matchedFacts, suggestion]
      properties:
        ruleCode:
          type: string
          maxLength: 64
          description: 已发布规则的稳定、非敏感编码；不返回内部条件、权重、脚本或可改写的规则表达式。
        matchedFacts:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 160
          description: 脱敏后的命中事实摘要；不得回显 SENSITIVE 字段或其他用户数据。
        suggestion:
          $ref: '#/components/schemas/CaseSuggestion'
    CaseSuggestion:
      type: object
      additionalProperties: false
      required: [kind, title, summary, action]
      properties:
        kind:
          type: string
          enum: [KNOWLEDGE_ARTICLE, RESOLVED_CASE]
        referenceId:
          type: string
          maxLength: 128
          description: 仅在当前主体具备查看权时返回；无权案例不得以 ID、标题、计数或匹配提示泄露存在性。
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
          description: 已脱敏的纯文本摘要，不含历史工单个人信息、内部评论、附件或处理人信息。
        action:
          type: string
          enum: [READ_AND_TRY, CONTINUE_CREATE]
          description: 仅供用户选择；不会自动关闭、更新、合并或处置工单。
    RuleMatchResponse:
      type: object
      additionalProperties: false
      required: [ruleEngine, matches]
      properties:
        ruleEngine:
          type: string
          const: DETERMINISTIC_RULES
        matches:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RuleMatch'
    ServiceCatalogDraftUpsertRequest:
      type: object
      additionalProperties: false
      required: [version, code, name, ticketType, categoryCode, fields, tagPolicy, reason]
      x-server-enforced:
        - service-manager-role-and-data-scope
        - catalog-version-and-optimistic-lock-check
        - field-schema-and-dictionary-reference-validation
        - no-script-or-executable-rule-content
        - four-eyes-publication-policy
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        ticketType:
          $ref: '#/components/schemas/TicketType'
        categoryCode:
