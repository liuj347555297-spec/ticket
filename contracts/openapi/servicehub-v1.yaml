              schema:
                $ref: '#/components/schemas/WorkflowOverviewReadModel'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workflow/approval-tasks:
    get:
      tags: [Workflow]
      summary: 查询当前身份的 Flowable 审批待办
      description: |
        审批申请创建时先以“策略候选集 ∩ 活动 IAM 身份 ∩ 申请时对象 DATA_SCOPE”冻结具体候选，并剔除申请人；
        待办读取时再以“冻结候选集 ∩ 当前活动 Flowable 指派任务 ∩ 当前对象 DATA_SCOPE”过滤；业务投影本身不构成待办或授权依据。
        响应不返回完整冻结候选身份、无权任务或全局总数，避免通过人员与计数枚举审批范围。
      operationId: listFlowableApprovalTasks
      parameters:
        - name: page
