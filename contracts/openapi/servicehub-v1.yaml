          maxLength: 2000
          description: 已按模板允许变量和数据权限净化/脱敏后的卡片文本。
        navigation:
          $ref: '#/components/schemas/ServerGeneratedInternalNavigation'
    NotificationDeliveryPayload:
      type: object
