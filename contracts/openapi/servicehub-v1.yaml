  /admin/design-studio/drafts:
    get:
      tags: [ServiceCatalogAdmin]
      operationId: listDesignStudioDrafts
      summary: 按当前组织数据范围列出设计草稿
      responses:
        '200':
          description: 管理者或审计员可见的设计包摘要
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StudioDraftSummary' }
        '403': { description: 无管理读取权限 }
    post:
      tags: [ServiceCatalogAdmin]
      operationId: createDesignStudioDraft
      summary: 创建系统内多表单 BPMN 设计包，不部署、不执行
      description: |
        SERVICE_MANAGER 与组织范围，或 PLATFORM_ADMIN。初始 version=0；DRAFT_ONLY。相同调用者/幂等键/初始配置重试不重复创建，冲突返回409。
        只接收白名单 BPMN 与控件元数据。新内嵌界面必须指定真实 systemCode，组织继承并匹配该系统；已有客户端省略归属仍可创建未归属旧格式草稿。
        可选 serviceCatalogItemId 必须真实存在，并具有该系统级启用映射或该系统某个活动模块的启用映射；服务不能脱离系统单独指定。
        这是设计关联，不要求系统已发布，也不产生可执行流程发布。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{8,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioDraftInput' }
      responses:
        '201':
          description: 已保存的设计包草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
        '400': { description: 非法 XML、控件、表单、节点绑定、系统或服务映射 }
        '403': { description: 角色或组织范围不允许 }
        '409': { description: 幂等键内容冲突 }
  /admin/design-studio/drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^DS-[0-9a-f-]{36}$' }
    get:
      tags: [ServiceCatalogAdmin]
      operationId: getDesignStudioDraft
      responses:
        '200':
          description: 可见组织范围内的完整设计包
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
        '403': { description: 角色或组织范围不允许 }
        '404': { description: 设计包不存在 }
    put:
      tags: [ServiceCatalogAdmin]
      operationId: updateDesignStudioDraft
      summary: 乐观锁保存设计包；不可修改所属组织、已归属系统/服务或冻结设计修订
      description: |
        缺少归属字段的历史 JSON 按未归属读取，可用正常版本锁明确归入同组织真实系统。
        已有 systemCode 不得更换或清除；已有 serviceCatalogItemId 不得更换或清除；系统级设计可后加服务。
        每次保存重新验证真实系统组织、主体范围与服务启用映射。冻结表单不可删除/修改，DRAFT_ONLY 不变。
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"?[0-9]{1,18}"?$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioDraftInput' }
      responses:
        '200':
          description: version递增后的设计包，业务表单修订号不随保存递增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDraft' }
        '400': { description: 非法配置或试图改写冻结修订 }
        '403': { description: 角色或组织范围不允许 }
        '409': { description: If-Match、请求version与当前version不一致 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICEHUB_SESSION
      description: 由 Spring Boot 维护的 HttpOnly、Secure、SameSite 会话 Cookie；浏览器不得将访问令牌写入 localStorage。
    integrationCallbackSignature:
      type: apiKey
      in: header
      name: X-Integration-Signature
      description: 仅受管连接器回调使用的签名头。服务端必须基于受管 secretRef、原始请求体、时间戳和事件 ID 验签；该头不是用户会话或通用 API 密钥。
  headers:
    IdempotencyStatus:
      description: 当前请求的服务端幂等状态；REPLAYED 表示返回首次等价结果，客户端不得据此更换键。HMAC 与 keyVersion 永不通过响应头暴露。
      schema:
        type: string
        enum: [RECEIVED, IN_PROGRESS, COMPLETED, REPLAYED, RETRYABLE_FAILED, FAILED, LEGACY_RESULT_ONLY, RECONCILIATION_REQUIRED, FAILED_FINAL]
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 对所有非安全方法必传；令牌绑定当前会话。
      schema:
        type: string
        minLength: 20
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端为一次写入意图生成的 UUID。服务端将键绑定到认证主体、方法、规范化资源/动作（工单、任务、队列或迁移计划）和规范化请求指纹；
        同一绑定在受控保留期内仅执行一次并返回原结果，使用相同键但不同指纹必须返回 IDEMPOTENCY_CONFLICT。
        键不可跨主体、资源或操作复用，且服务端记录首次接收时间、处理中/完成/失败状态、原结果和审计关联以防重放。
        请求指纹由服务端使用受管 HMAC 密钥计算并常量时间比较；客户端不提交/接收指纹或 keyVersion，密钥轮换对客户端透明。
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
    WorkflowApprovalRequestId:
      name: requestId
      in: path
      required: true
      description: 受控跳转审批申请 UUID；只用于定位，不能替代当前工单、审批候选资格或数据范围授权。
      schema:
        type: string
        format: uuid
    WorkflowIfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前工单版本的 HTTP 强实体标签；必须使用双引号包裹，例如 `"0"`。服务端以此执行乐观锁并拒绝过期页面或重复执行。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
        example: '"0"'
    IntegrationConnectionCode:
      name: integrationConnectionCode
      in: path
      required: true
      description: 预注册的受管连接器编码；不得由请求指定连接器类型、端点、协议或回调地址。
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{2,62}$'
    ConfigurationItemId:
      name: configurationItemId
      in: path
      required: true
      description: CMDB CI 投影定位符；服务端仍须执行当前数据范围和 CI 可见性校验。
      schema:
        type: string
        pattern: '^CI-[A-Za-z0-9_-]{8,64}$'
    IntegrationCallbackTimestamp:
      name: X-Integration-Timestamp
      in: header
      required: true
      description: 由受管发送方签名的 UTC 时间戳；服务端仅接受受控时间窗内的请求。
      schema:
        type: string
        format: date-time
    IntegrationCallbackEventId:
      name: X-Integration-Event-Id
      in: header
      required: true
      description: 受管发送方的事件唯一键，与连接、时间戳、原始载荷摘要共同用于重放防护和幂等。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IntegrationCallbackSignature:
      name: X-Integration-Signature
      in: header
      required: true
      description: 回调签名；服务端恒定时间验签，禁止记录或回显该值。
      schema:
        type: string
        minLength: 16
        maxLength: 1024
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: 附件定位符；不得据此推断下载权或对象存储键。
      schema:
        type: string
        pattern: '^ATT-[A-Za-z0-9_-]{8,64}$'
    KnowledgeArticleId:
      name: knowledgeArticleId
      in: path
      required: true
      description: 知识文档定位符；普通检索仅可查看已发布且当前主体有权查看的版本。
      schema:
        type: string
        pattern: '^KB-[A-Za-z0-9_-]{8,64}$'
    KnowledgeImportJobId:
      name: knowledgeImportJobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^KBIMP-[A-Za-z0-9_-]{8,64}$'
    KnowledgeVersion:
      name: knowledgeVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SupportQueueCode:
      name: supportQueueCode
      in: path
      required: true
      description: 团队队列稳定编码；只用于定位，服务端仍逐对象校验管理角色、组织 DATA_SCOPE 和队列管理关系。未知与未授权编码按相同防枚举策略处理。
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_-]{1,63}$'
    SupportQueueMigrationPlanId:
      name: migrationPlanId
      in: path
      required: true
      description: 停用迁移计划稳定 ID；未知与未授权计划统一按防枚举策略处理。
      schema:
        type: string
        pattern: '^SQMP-[A-Za-z0-9_-]{8,64}$'
    HistoricalIdempotencyKey:
      name: idempotencyKey
      in: path
      required: true
      description: 历史队列写入的原幂等键，仅用于有权人工对账定位；未知与无权记录返回相同 404。不得记录在应用日志或分析事件中。
      schema:
        type: string
        format: uuid
    SupportQueueIdempotencyReconciliationId:
      name: reconciliationId
      in: path
      required: true
      description: 人工对账申请 ID；不构成读取或复核权限。
      schema:
        type: string
        pattern: '^SQIR-[A-Za-z0-9_-]{8,64}$'
    IdempotencyIfMatch:
      name: If-Match
      in: header
      required: true
      description: 历史幂等记录或对账申请的当前版本 ETag；版本变化时返回 409，客户端必须重新读取后处理。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    WorkflowTaskId:
      name: taskId
      in: path
      required: true
      description: Flowable 用户任务引用；仅作定位，服务端仍须验证工单、流程实例、当前节点及当前主体的任务关系。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^IAMSYNC-[A-Za-z0-9_-]{8,64}$'
    ServiceCatalogItemId:
      name: serviceCatalogItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
    DictionaryCode:
      name: dictionaryCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{1,62}$'
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 仅作消息定位；服务端必须以当前认证主体为收件人重新执行对象级授权，不能据此读取、标记或枚举其他人的消息。
      schema:
        type: string
        pattern: '^NTF-[A-Za-z0-9_-]{8,64}$'
    NotificationChannelCode:
      name: channelCode
      in: path
      required: true
      description: 仅接受受控适配器允许列表中的通道编码；服务端忽略任何客户端传入的端点、回调、租户或密钥参数。
      schema:
        $ref: '#/components/schemas/NotificationChannelCode'
    NotificationRoutingRuleId:
      name: routingRuleId
      in: path
      required: true
      description: 路由规则定位符；服务端仍须基于当前管理员/审计员的组织配置范围逐对象授权。
      schema:
        type: string
        pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
    NotificationCategory:
      name: category
      in: path
      required: true
      description: 当前主体可配置的消息类别；是否允许退订由服务端策略决定，强制待办类别不可关闭。
      schema:
        $ref: '#/components/schemas/NotificationCategory'
    SlaPolicyId:
      name: slaPolicyId
      in: path
      required: true
      description: SLA 策略逻辑标识；不构成配置读取、修改或发布权限。
      schema:
        type: string
        pattern: '^SLA-[A-Za-z0-9_-]{8,64}$'
    SlaPolicyVersion:
      name: slaPolicyVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SlaWorkCalendarId:
      name: slaWorkCalendarId
      in: path
      required: true
      description: 工作日历逻辑标识；服务端仍须校验当前管理范围和版本状态。
      schema:
        type: string
        pattern: '^SLACAL-[A-Za-z0-9_-]{8,64}$'
    SlaWorkCalendarVersion:
      name: slaWorkCalendarVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReportExportJobId:
      name: reportExportJobId
      in: path
      required: true
      description: 导出任务定位符，绝不构成查看状态或下载文件的授权。
      schema:
        type: string
        pattern: '^REXP-[A-Za-z0-9_-]{8,64}$'
    ReportFrom:
      name: from
      in: query
      required: true
      description: 统计区间起点，包含该时刻；服务端限制最大回溯期和最大跨度。
      schema:
        type: string
        format: date-time
    ReportTo:
      name: to
      in: query
      required: true
      description: 统计区间终点，不包含该时刻；服务端校验 from < to 及受控最大跨度。
      schema:
        type: string
        format: date-time
    ReportTimeZone:
      name: timeZone
      in: query
      description: |
        用于展示分桶边界的 IANA 时区，默认服务端按组织/平台配置决定。仅允许服务端白名单中的 IANA 名称；
        所有响应同时返回实际生效时区，指标原始计算时刻均为 UTC。
      schema:
        type: string
        pattern: '^[A-Za-z]+(?:[_+-][A-Za-z0-9]+)*(?:/[A-Za-z0-9_+.-]+)+$'
        maxLength: 64
    ReportOrganizationIamId:
      name: organizationIamOrganizationId
      in: query
      description: |
        可选的组织范围筛选，仅能收窄当前主体实时数据范围；不可用 ID 扩大范围。跨组织、含下级或超过服务端大范围阈值的请求
        必须完成二次鉴权并审计；无权对象按防枚举策略处理。
      schema:
        type: string
        maxLength: 128
    ReportIncludeDescendants:
      name: includeDescendants
      in: query
      description: 仅在当前组织范围内生效；服务端以 IAM 当前组织树计算，不能由客户端提供下级列表。
      schema:
        type: boolean
        default: false
    ReportPurpose:
      name: X-Report-Purpose
      in: header
      description: 大范围、跨组织或导出时必填的受控用途说明；服务端净化、限长、审计并可要求二次鉴权。
      schema:
        type: string
        minLength: 4
        maxLength: 300
    ReportAccessGrant:
      name: X-Report-Access-Grant
      in: header
      description: |
        当服务端判定为跨组织、大范围或导出时必填。该值只能是服务端在二次认证/审批后签发、绑定当前主体、规范化筛选、用途、操作和短时有效期的授权凭据；
        不能由前端自行构造，不能跨主体、报表类型、范围或导出任务复用，且不得记录在日志、URL 或客户端持久化存储。
      schema:
        type: string
        minLength: 20
        maxLength: 2048
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 服务端签名的不透明分页游标；绑定当前主体、授权版本、筛选、排序、快照上界和上一页边界，客户端不得解析或修改。
      schema:
        type: string
        minLength: 20
        maxLength: 2048
  responses:
    ValidationFailed:
      description: 请求字段或服务目录规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: 会话不存在、过期或 IAM 身份不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 已认证但不具备当前对象、动作或数据范围权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 对象不存在或按防枚举策略不可见
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    KnowledgeScopeForbidden:
      description: 当前主体缺少知识管理角色、目标组织 DATA_SCOPE 或目录范围；不返回对象、候选人、数量或其他组织是否存在的差异。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    KnowledgeObjectNotFound:
      description: 知识对象不存在，或其组织、目录、状态不在当前主体统一读取/管理谓词内；两种情况返回相同安全结构以防枚举。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等键冲突、状态冲突或乐观锁冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AttachmentRejected:
      description: 文件超过受控限制、类型不在服务端白名单内或文件内容校验失败；不返回规则细节或恶意样本信息。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AttachmentNotAvailable:
      description: 附件仍在扫描、处于隔离/拒绝状态、已逻辑删除保留，或扫描服务不可用导致无法安全放行。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 请求频率超过当前主体或来源限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 服务暂不可接收流量
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    WorkflowBpmnDiagram:
      type: object
      required: [processKey, processDefinitionId, version, bpmnXml, layoutSource, activeNodeIds, completedNodeIds, availability]
      properties:
        processKey: { type: string }
        processDefinitionId: { type: [string, 'null'] }
        version: { type: [integer, 'null'] }
        bpmnXml: { type: [string, 'null'], description: 剥离执行扩展的标准BPMN与DI，仅展示、不可部署 }
        layoutSource: { type: string, enum: [AUTHORED, GENERATED, NONE] }
        activeNodeIds: { type: array, items: { type: string } }
        completedNodeIds: { type: array, items: { type: string } }
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE_LEGACY] }
    StudioField:
      type: object
      additionalProperties: false
      required: [id, code, label, control, controlVersion, required, sensitive, helpText, options]
      properties:
        id: { type: string, maxLength: 128 }
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 表单内唯一；拒绝系统保留字段 }
        label: { type: string, minLength: 1, maxLength: 80 }
        control: { type: string, enum: [text, textarea, number, date, datetime, select, multiselect, boolean, richtext, tags, ci, attachment, iam, user, section] }
        controlVersion: { type: integer, const: 1 }
        required: { type: boolean }
        sensitive: { type: boolean }
        helpText: { type: string, maxLength: 300 }
        dictionaryCode: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,62}$' }
        options:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value: { type: string, minLength: 1, maxLength: 100 }
              label: { type: string, minLength: 1, maxLength: 100 }
    StudioFormRevision:
      type: object
      additionalProperties: false
      required: [formId, code, name, revision, status, fields]
      properties:
        formId: { type: string, maxLength: 128 }
        code: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        revision: { type: integer, minimum: 1, maximum: 100000, description: 同一表单新增修订为max+1，旧绑定不自动升级 }
        status: { type: string, enum: [DRAFT, FROZEN], description: FROZEN只是不可变设计快照，不是发布 }
        fields: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/StudioField' } }
    StudioNodeFormBinding:
      type: object
      additionalProperties: false
      required: [nodeId, formId, formRevision, displayOrder, mode, requiredOnComplete]
      properties:
        nodeId: { type: string, description: 当前BPMN内存在的startEvent或userTask }
        formId: { type: string }
        formRevision: { type: integer, minimum: 1 }
        displayOrder: { type: integer, minimum: 1, maximum: 500, description: 同节点内顺序不重复 }
        mode: { type: string, enum: [EDIT, READ_ONLY] }
        requiredOnComplete: { type: boolean }
    StudioDraftInput:
      type: object
      additionalProperties: false
      required: [version, name, organizationId, bpmnXml, forms, nodeBindings, reason]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 120 }
        organizationId: { type: string, maxLength: 128 }
        systemCode: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{2,63}$', description: 真实系统归属；旧客户端可省略，新界面必须先保存系统。已归属后不可清除或更换。 }
        serviceCatalogItemId: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{3,64}$', description: 可选系统内服务，必须与系统或其活动模块有启用映射；不得在无系统时指定。已关联后不可清除或换绑。 }
        bpmnXml: { type: string, minLength: 1, maxLength: 524288, description: UTF-8编码上限512KiB；单process标准BPMN/DI白名单；禁止isExecutable=true、DTD/实体、脚本、表达式、执行扩展 }
        forms: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/StudioFormRevision' } }
        nodeBindings: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/StudioNodeFormBinding' } }
        reason: { type: string, minLength: 4, maxLength: 500 }
    StudioDraft:
      type: object
      additionalProperties: false
