            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityDeepLinkPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workflow/ticket-lifecycle/diagram:
    get:
      tags: [Workflow]
