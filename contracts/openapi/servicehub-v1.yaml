      description: |
        每次下载同时校验工单关系、附件可见性、数据范围、当前 IAM 状态和逻辑删除保留状态；附件 ID 不能替代授权。
        仅 SCAN_PASSED 且未逻辑删除的文件可返回。服务端固定 Content-Disposition: attachment、净化展示文件名、按服务端探测的 MIME 类型响应，
        不信任客户端 MIME/文件名，也不提供直接对象存储 URL。
      operationId: downloadTicketAttachmentContent
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: 附件二进制流；响应头由服务端固定生成。
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
              description: 固定为 attachment 并使用净化后的服务端展示名。
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AttachmentNotAvailable'
