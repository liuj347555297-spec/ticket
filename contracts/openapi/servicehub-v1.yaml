      description: |
        文件下载时必须再次验证当前 IAM 身份、申请人或受权审计/管理关系、当前数据范围、短时有效期和二次授权绑定；
        每次下载写入审计。只允许服务端生成的 `attachment` 响应和受控文件名，不返回对象存储地址、永久 URL 或无鉴权链接。
