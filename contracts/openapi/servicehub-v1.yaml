        aggregationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: 服务端对同一收件人、事件、来源对象和路由版本进行去重/聚合的固定窗口；窗口键与合并摘要由服务端生成，不能由客户端修改。
        enabled:
          type: boolean
        lifecycleStatus:
