      type: object
      additionalProperties: false
      required: [recipientScope, reason]
      x-server-enforced:
        - platform-administrator-authorization
        - configured-channel-and-managed-secret-reference-check
        - server-determined-test-recipient-only
        - fixed-plain-text-test-template-only
        - subject-operation-channel-request-fingerprint-anti-replay
        - channel-test-rate-limit
        - transactional-outbox-and-delivery-unique-key
        - immutable-audit-event
      properties:
        recipientScope:
          $ref: '#/components/schemas/ControlledNotificationTestRecipientScope'
        reason:
          type: string
          minLength: 4
          maxLength: 500
          description: 受控测试理由；服务端脱敏并审计。不得包含密钥、令牌、收件人地址、URL 或业务工单内容。
    ControlledNotificationTestDeliveryResult:
      type: object
      additionalProperties: false
      required: [testDeliveryId, channel, state, acceptedAt, auditEventId]
      properties:
        testDeliveryId:
          type: string
          pattern: '^NTEST-[A-Za-z0-9_-]{8,64}$'
          description: 仅用于当前管理员查询其受控测试的审计关联；不用于消息内容或投递对象枚举。
        channel:
          $ref: '#/components/schemas/NotificationChannelCode'
        state:
          type: string
          enum: [QUEUED, SUPPRESSED]
          description: 仅表示已进入 outbox 或被安全策略抑制；不表示外部服务已接收。
        acceptedAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          maxLength: 128
    NotificationRoutingEvent:
      type: string
      description: 仅允许已发布、服务端产生的业务事件参与通道路由；客户端不得传入自定义事件、表达式或事件载荷。
      enum: [TICKET_CREATED, TICKET_ASSIGNED, TICKET_STATUS_CHANGED, WORKFLOW_TASK_CREATED, WORKFLOW_TASK_REMINDER, SLA_BREACH_RISK, SLA_BREACHED, SYSTEM_ANNOUNCEMENT, INTEGRATION_ALERT]
    NotificationRoutingRuleLifecycleStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, RETIRED, REJECTED]
    NotificationRoutingResolution:
      type: string
      enum: [PUBLISHED_RULE, IN_APP_FALLBACK, SYSTEM_IN_APP_DEFAULT]
    NotificationRoutingRule:
      type: object
      additionalProperties: false
      description: |
        组织到通道的受控配置规则。它只为服务端已计算并已授权的收件人选择投递通道，不是收件人选择器；
        不包含任何用户、群组、外部地址、供应商标识、端点、密钥、模板正文或可执行表达式。
      required: [id, organizationIamOrganizationId, includeDescendants, events, channelCode, inAppFallback, priority, aggregationWindowSeconds, enabled, lifecycleStatus, version, createdAt, auditEventId]
      properties:
        id:
          type: string
          pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
        organizationIamOrganizationId:
          type: string
          maxLength: 128
          description: IAM 只读组织投影 ID；服务端校验当前管理范围和组织存在性，不返回/接受任意组织路径表达式。
        includeDescendants:
          type: boolean
          description: 是否匹配该组织的后代组织；组织树解析仅由服务端 IAM 投影完成。
        events:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationRoutingEvent'
        channelCode:
          $ref: '#/components/schemas/NotificationChannelCode'
        inAppFallback:
          type: boolean
          description: 外部通道不可用、收件人无受控外部映射或策略抑制时是否由服务端回退至 IN_APP；不能回退为任意地址或客户端指定通道。
        priority:
          type: integer
          minimum: 1
          maximum: 10000
          description: 同一组织/事件的通道选择优先级（数值越小越优先）；服务端拒绝歧义并在发布时确定唯一优先匹配，IN_APP fallback 仅在优先通道不可用或策略抑制时触发。
        aggregationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: 服务端对同一收件人、事件、来源对象和路由版本进行去重/聚合的固定窗口；窗口键与合并摘要由服务端生成，不能由客户端修改。
        enabled:
          type: boolean
        lifecycleStatus:
          $ref: '#/components/schemas/NotificationRoutingRuleLifecycleStatus'
        version:
          type: integer
          minimum: 0
          description: 草稿更新乐观锁版本；发布版本不可原地修改。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          maxLength: 128
    NotificationRoutingRulePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRoutingRule'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    NotificationRoutingRuleDraftUpsertRequest:
      type: object
      additionalProperties: false
