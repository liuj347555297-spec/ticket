      description: |
        服务端仅根据已授权工单、关联 CI/告警和部署受管的固定链接模板生成深链接；不接受或回显客户端 URL、查询参数、时间范围、索引、主机、协议或跳转目标。
        每次生成与访问都需重新执行对象级授权；链接不得携带密码、令牌、签名、Cookie、内部地址或开放重定向参数，且不会成为访问日志/APM 原始数据的越权通道。
