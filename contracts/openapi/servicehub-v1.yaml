          type: string
          maxLength: 128
    NotificationRoutingSnapshot:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        每条 `notification_delivery` 与对应 outbox 投递意图在创建时固化的路由事实；后续规则编辑、组织调整和通道配置变更不得回写。
        仅受控审计/运维链路按最小权限查看，普通收件人投递状态接口不返回本对象。
      required: [resolution, matchedOrganizationIamOrganizationId, event, requestedChannel, resolvedChannel, inAppFallbackEnabled, inAppFallbackApplied, aggregationWindowSeconds, capturedAt]
      properties:
        resolution:
          $ref: '#/components/schemas/NotificationRoutingResolution'
        matchedRuleId:
          type: string
          pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
          description: 仅 PUBLISHED_RULE 或该规则触发 fallback 时保留；系统默认 IN_APP 路由可省略。
        matchedRuleVersion:
          type: integer
          minimum: 0
        matchedOrganizationIamOrganizationId:
          type: string
          maxLength: 128
        includeDescendants:
          type: boolean
        event:
          $ref: '#/components/schemas/NotificationRoutingEvent'
        requestedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        resolvedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        inAppFallbackEnabled:
          type: boolean
        inAppFallbackApplied:
          type: boolean
        aggregationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: 投递创建时使用的去重/聚合窗口快照；规则更新后不得改变历史记录。
        capturedAt:
          type: string
          format: date-time
