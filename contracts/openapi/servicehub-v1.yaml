        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets/{ticketId}/workflow/actions:
    post:
      tags: [Workflow]
      summary: 提交服务端受控的工单流程动作
      description: 客户端仅可提交动作意图和受限输入；状态、节点、候选人、组织范围、SLA 与通知收件人均由服务端重新计算。`CONTROLLED_JUMP_REQUEST` 只创建 Flowable 审批实例，不执行节点迁移。
      operationId: executeTicketWorkflowAction
