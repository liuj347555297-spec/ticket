    get:
      tags: [SupportQueueAdmin]
      summary: 查询当前主体的一次队列写入幂等状态
      description: |
        使用 `Idempotency-Key` 请求头查询与当前 IAM 主体绑定的队列写操作。未知键与其他主体的键返回相同 404；
        响应不返回规范化请求、请求指纹、HMAC、keyVersion、租约令牌、执行节点内部标识或敏感错误。客户端在 IN_PROGRESS/超时场景必须保留原键查询，不得换键盲目重试。
        HMAC 指纹计算、常量时间比较和 keyVersion 轮换完全由服务端管理，对客户端透明。
      operationId: getSupportQueueIdempotencyStatus
