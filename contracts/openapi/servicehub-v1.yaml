openapi: 3.1.0
info:
  title: ServiceHub 工单平台 API
  version: 1.0.0-draft.1
  description: |
    Vue 3 门户与 Spring Boot 单体服务的共享 v1 契约。所有业务 API 都由服务端执行对象级、流程动作和数据范围鉴权；UI 隐藏不是授权控制。
    附件与知识库文档必须先进入隔离区，完成服务端白名单校验和恶意文件扫描后才可下载、索引或发布。消息仅通过受控站内信和受管通道适配器投递；不得以通用回调、任意 URL 或客户端指定收件人替代。
    本版本不包含 AI、向量检索、自动生成、自动问答或自动处置能力。
    外部监控、CMDB、日志与 APM 仅通过受管连接器集成；本版本不实现自建监控平台、eBPF、自动发现 CMDB 或数据库运维平台。
servers:
  - url: /api/v1
    description: 同源网关路径
tags:
  - name: System
  - name: Identity
  - name: IdentitySync
  - name: BackofficeAccessAdmin
  - name: Security
  - name: Tickets
  - name: Workflow
  - name: Collaboration
  - name: Comments
  - name: ServiceCatalog
  - name: ServiceCatalogAdmin
  - name: SupportQueueAdmin
  - name: RuleMatching
  - name: Notifications
  - name: NotificationAdmin
  - name: NotificationRoutingAdmin
  - name: Attachments
  - name: KnowledgeBase
  - name: KnowledgeBaseAdmin
  - name: Sla
  - name: SlaAdmin
  - name: OperationsReporting
  - name: OperationsReportingAdmin
  - name: Integrations
  - name: IntegrationAdmin
  - name: Cmdb
  - name: Alerts
  - name: Observability
paths:
  /service-systems/{systemCode}/catalog-items:
    get:
      tags: [ServiceCatalog]
      operationId: listPublishedSystemCatalogItems
      summary: 读取当前系统下可发起的工单服务
      description: |
        返回完整数组，不受全局目录第一页或 100 条分页上限影响。系统必须已发布且属于当前活动 IAM 主组织。
        未指定模块时使用系统级启用映射；指定活动模块且存在启用模块映射时采用模块映射，否则回退系统映射。
        映射优先级先于可见性筛选：模块映射的服务全部不可见时返回空数组，不再次回退系统映射。
        仅返回已发布的服务；受管目录必须明确适用于当前 IAM 组织，空组织不视为全局可见。
        同 ID 受管记录优先于旧种子，即使该受管记录已停用或处于草稿也不会重新暴露旧种子。
        旧种子服务只能通过该组织系统的显式映射进入结果。接口不暴露内部路由，也不授权部署设计器草稿。
      parameters:
        - name: systemCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        - name: moduleCode
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
      responses:
        '200':
          description: 当前系统和可选模块下的完整已发布服务条目；无匹配时为空数组。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /health:
    get:
      tags: [System]
      summary: 存活与就绪探针
      description: 仅用于网关/负载均衡探测，不返回版本、依赖地址、堆栈或敏感配置。
      security: []
      responses:
        '200':
          description: 服务可接收流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      summary: 获取当前 IAM 用户及平台投影
      description: |
        返回当前已认证主体的只读 IAM 用户/组织投影及当前授权摘要；不返回密码、IAM 令牌、完整联系方式或组织管理能力。
        平台不创建本地账号、不编辑 IAM 用户或组织；响应仅用于展示，不得替代每次请求的服务端实时授权。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /identity/organizations:
    get:
      tags: [Identity]
      summary: 查询只读组织投影
      description: |
        仅返回当前主体在组织数据范围内可见的 IAM 组织投影。该接口没有创建、更新或删除语义；
        禁止借由父节点、关键词或分页参数枚举越权组织。服务端根据当前主体实时计算可见范围。
      operationId: listOrganizationProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: parentIamOrganizationId
          in: query
          description: 仅作为当前可见范围内的父组织筛选条件；不具备该父组织可见权时按防枚举策略处理。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 组织名称或编码关键词；服务端执行长度限制、转义和数据范围过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读组织投影分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/users:
    get:
      tags: [Identity]
      summary: 查询只读用户投影及候选人摘要
      description: |
        用于分派、审批候选人、消息投递和组织数据权限的只读查询。服务端按调用人数据范围、用途和最小字段集过滤；
        不返回密码、认证令牌或不必要联系方式。不得用此接口创建、编辑、禁用本地用户，亦不得以搜索枚举全量 IAM 人员。
      operationId: listUserProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: iamOrganizationId
          in: query
          description: 仅作为当前主体有权访问的组织筛选条件。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 姓名、登录名或工号关键词；服务端最小长度、转义、限流和范围过滤。
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: candidateFor
          in: query
          description: 可选的服务/队列/流程候选人场景；服务端校验调用人是否能查看该场景及被查询人是否有效。
          schema:
            type: string
            maxLength: 128
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读用户/候选人摘要分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/sync-jobs:
    post:
      tags: [IdentitySync]
      summary: 受控触发 IAM 投影同步
      description: |
        仅 `PLATFORM_ADMIN` 或被授予 IAM 投影运维职责的主体可调用。同步连接、凭据、字段映射和增量游标均仅在服务端受管配置中保存；
        请求不接受 IAM 地址、密钥、用户/组织数据或任意脚本。服务端串行/幂等调度、记录来源版本和审计事件，且不会创建本地认证账号。
      operationId: triggerIdentityProjectionSync
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-required-platform-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySyncTriggerRequest'
      responses:
        '202':
          description: 同步任务已被受控受理；不代表数据已同步完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /identity/sync-jobs/{syncJobId}:
    get:
      tags: [IdentitySync]
      summary: 查询 IAM 投影同步状态
      description: |
        仅 `PLATFORM_ADMIN`、IAM 投影运维职责或审计职责可查询。仅返回脱敏的运行摘要、计数、来源版本和审计关联，
        不返回连接串、令牌、原始 IAM 载荷、完整失败记录或个人信息。
      operationId: getIdentityProjectionSyncJob
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/SyncJobId'
      responses:
        '200':
          description: 已授权的同步任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /security/csrf:
    get:
      tags: [Security]
      summary: 获取当前会话的 CSRF 令牌
      operationId: getCsrfToken
      responses:
        '200':
          description: 仅对当前会话有效的 CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /security/session:
    delete:
      tags: [Security]
      summary: 注销当前会话
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 会话已失效；重复调用同样视为成功。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets:
    get:
      tags: [Tickets]
      summary: 在当前数据范围内查询工单
      description: 服务端忽略或拒绝越出当前授权范围的组织、队列、人员等筛选条件；不会依赖前端过滤。
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: q
          in: query
          description: 关键词；服务端执行长度限制、转义和权限过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: queue
          in: query
          description: 当前主体的个人派生视图；团队队列改用后续服务端返回的稳定 queueCode，不能提交他人身份或任意组织扩大结果集。
          schema:
            $ref: '#/components/schemas/TicketQueue'
        - name: teamQueueCode
          in: query
          description: |
            经服务端授权的稳定团队队列编码，与个人 `queue` 互斥。服务端按当前成员/主管关系、组织 DATA_SCOPE、目录范围和队列状态重新校验；
            未知与未授权编码使用相同的防枚举结果，不返回队列名称、成员、总数或是否存在。
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_-]{1,63}$'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: serviceCatalog
          in: query
          description: 服务目录编号或名称关键词；只能缩小当前授权范围。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: requesterOrganization
          in: query
          description: 申请组织编号或名称关键词；只能缩小当前授权范围，不能据此声明数据权限。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 已按当前授权范围和查询快照过滤的键集分页结果；nextCursor 仅可由同一主体在相同授权版本和筛选条件下继续使用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          description: "`queue` 与 `teamQueueCode` 同时提交，或筛选/游标组合无效。"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 团队队列不存在或当前主体无权获知该队列；两种情况返回同一安全错误结构。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Tickets]
      summary: 创建工单
      description: 以当前认证身份作为提单人。requesterId、组织、优先级、队列、状态和处理人均不得由客户端指定。
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: 工单已创建
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: 新工单相对地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: 获取单张工单
      description: 详情、评论、附件及关联信息需逐对象重新授权；无权访问时不得借由错误消息泄露对象存在性。
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 已授权的工单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/actions:
    post:
      tags: [Workflow]
      summary: 执行工单生命周期动作
      description: |
        覆盖提交、分类、分派、受理、开始处理、待用户反馈、解决、关闭、重开、撤销、挂起、恢复和升级。
        客户端仅表达动作意图及结构化业务事实；服务端逐对象校验身份、数据范围、当前状态、流程节点、候选人、审批策略和 SLA 影响，
        并决定是否创建审批任务或拒绝动作。客户端不得指定目标状态、流程变量、审批结论、优先级、队列或处理人。
      operationId: executeTicketAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketActionRequest'
      responses:
        '200':
          description: 动作已立即完成，或已按规则创建后续审批/流程任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/relations:
    get:
      tags: [Tickets]
      summary: 查询当前主体可见的关联工单
      description: |
        先校验当前工单，再对每一张关联目标重新执行对象读取授权；无权目标不得以编号、标题、数量或错误信息泄露存在性。
        关系不改变工单状态、审批、处理人或 SLA。
      operationId: listTicketRelations
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 当前主体可见的受控关系
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketRelation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tickets]
      summary: 建立受控工单关系
      description: |
        调用者必须具有源单修改权和目标单读取权。客户端仅提交目标编号和受控关系类型，不能提交目标摘要、组织范围、审批结论或状态。
        同一关系按自然键去重；`RELATED` 由服务端规范化为无方向关系。
      operationId: createTicketRelation
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRelationRequest'
      responses:
        '201':
          description: 关系已创建或安全幂等确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRelation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/work-actions:
    post:
      tags: [Collaboration]
      summary: 执行转办、协办、抢单、主办指定或交接班
      description: |
        覆盖转办、添加/移除协办、抢单、指定主办与交接班。targetIamUserId 仅是候选目标，
        服务端必须验证该人员 IAM 用户投影与平台角色投影均为活动状态、班次/技能/队列/组织数据范围、当前任务候选资格和审批要求；
        不能通过请求体变更提交人、角色、队列、流程受让人或历史身份快照。
      operationId: executeTicketWorkAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketWorkActionRequest'
      responses:
        '200':
          description: 协同关系或任务受让人已更新，或已创建审批任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow-tasks:
    get:
      tags: [Workflow]
      summary: 查询当前主体可操作或可见的 BPMN 任务
      description: |
