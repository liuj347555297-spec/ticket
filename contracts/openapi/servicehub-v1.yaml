        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    NotificationDeliveryRecord:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        `notification_delivery` 持久化记录的安全模型。每一条通道投递均保存命中的规则/路由快照、模板版本和收件人身份快照，
        以避免规则变更、人员调岗或通道调整改写历史；普通收件人 API 只能返回脱敏的 `NotificationDelivery` 摘要。
      required: [id, notificationId, recipient, channel, routingSnapshot, payload, state, attemptCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        notificationId:
          type: string
          format: uuid
        recipient:
          $ref: '#/components/schemas/IdentitySnapshot'
        channel:
          $ref: '#/components/schemas/NotificationChannelCode'
        routingSnapshot:
          $ref: '#/components/schemas/NotificationRoutingSnapshot'
        payload:
          $ref: '#/components/schemas/NotificationDeliveryPayload'
        state:
          $ref: '#/components/schemas/NotificationDeliveryState'
        attemptCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    NotificationOutboxRecord:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        服务端事务性 outbox 记录模型：业务事务与创建消息/投递意图原子提交，异步消费者以唯一投递键获取、锁定并处理。
        该模型不得通过普通 API 返回，也不得包含明文密钥、外部端点、收件人地址、供应商回执或可执行模板；原始载荷仅在受控加密存储内按最小权限访问。
      required: [id, notificationId, channel, deliveryKey, routingSnapshot, payload, state, attemptCount, availableAt, createdAt, auditEventId]
      properties:
        id:
          type: string
          format: uuid
        notificationId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannelCode'
        deliveryKey:
          type: string
          maxLength: 128
          description: 服务端生成并对 notification、收件人身份快照、通道和模板版本唯一约束的投递幂等键；不能由客户端提供或复用。
        routingSnapshot:
          $ref: '#/components/schemas/NotificationRoutingSnapshot'
          description: 创建投递意图时固化的命中发布规则/IN_APP fallback/默认路由快照；后续规则变更不得回写。
        payload:
          $ref: '#/components/schemas/NotificationDeliveryPayload'
          description: 受控加密存储的服务端渲染载荷；不通过普通 API 返回。
        state:
          $ref: '#/components/schemas/NotificationDeliveryState'
        attemptCount:
          type: integer
          minimum: 0
        availableAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          maxLength: 128
    ManagedSecretReferenceStatus:
