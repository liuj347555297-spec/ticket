openapi: 3.1.0
info:
  title: ServiceHub 工单平台 API
  version: 1.0.0-draft.1
  description: |
    Vue 3 门户与 Spring Boot 单体服务的共享 v1 契约。所有业务 API 都由服务端执行对象级、流程动作和数据范围鉴权；UI 隐藏不是授权控制。
    附件与消息通道的上传/下载、投递回执接口保留为后续独立契约：当前版本不得以未受控的通用文件或回调接口替代。
servers:
  - url: /api/v1
    description: 同源网关路径
tags:
  - name: System
  - name: Identity
  - name: IdentitySync
  - name: Security
  - name: Tickets
  - name: Workflow
  - name: Collaboration
  - name: Comments
  - name: ServiceCatalog
  - name: ServiceCatalogAdmin
  - name: RuleMatching
paths:
  /health:
    get:
      tags: [System]
      summary: 存活与就绪探针
      description: 仅用于网关/负载均衡探测，不返回版本、依赖地址、堆栈或敏感配置。
      security: []
      responses:
        '200':
          description: 服务可接收流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      summary: 获取当前 IAM 用户及平台投影
      description: |
        返回当前已认证主体的只读 IAM 用户/组织投影及当前授权摘要；不返回密码、IAM 令牌、完整联系方式或组织管理能力。
        平台不创建本地账号、不编辑 IAM 用户或组织；响应仅用于展示，不得替代每次请求的服务端实时授权。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /identity/organizations:
    get:
      tags: [Identity]
      summary: 查询只读组织投影
      description: |
        仅返回当前主体在组织数据范围内可见的 IAM 组织投影。该接口没有创建、更新或删除语义；
        禁止借由父节点、关键词或分页参数枚举越权组织。服务端根据当前主体实时计算可见范围。
      operationId: listOrganizationProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: parentIamOrganizationId
          in: query
          description: 仅作为当前可见范围内的父组织筛选条件；不具备该父组织可见权时按防枚举策略处理。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 组织名称或编码关键词；服务端执行长度限制、转义和数据范围过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读组织投影分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/users:
    get:
      tags: [Identity]
      summary: 查询只读用户投影及候选人摘要
      description: |
        用于分派、审批候选人、消息投递和组织数据权限的只读查询。服务端按调用人数据范围、用途和最小字段集过滤；
        不返回密码、认证令牌或不必要联系方式。不得用此接口创建、编辑、禁用本地用户，亦不得以搜索枚举全量 IAM 人员。
      operationId: listUserProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: iamOrganizationId
          in: query
          description: 仅作为当前主体有权访问的组织筛选条件。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 姓名、登录名或工号关键词；服务端最小长度、转义、限流和范围过滤。
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: candidateFor
          in: query
          description: 可选的服务/队列/流程候选人场景；服务端校验调用人是否能查看该场景及被查询人是否有效。
          schema:
            type: string
            maxLength: 128
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读用户/候选人摘要分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/sync-jobs:
    post:
      tags: [IdentitySync]
      summary: 受控触发 IAM 投影同步
      description: |
        仅 `PLATFORM_ADMIN` 或被授予 IAM 投影运维职责的主体可调用。同步连接、凭据、字段映射和增量游标均仅在服务端受管配置中保存；
        请求不接受 IAM 地址、密钥、用户/组织数据或任意脚本。服务端串行/幂等调度、记录来源版本和审计事件，且不会创建本地认证账号。
      operationId: triggerIdentityProjectionSync
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-required-platform-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySyncTriggerRequest'
      responses:
        '202':
          description: 同步任务已被受控受理；不代表数据已同步完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /identity/sync-jobs/{syncJobId}:
    get:
      tags: [IdentitySync]
      summary: 查询 IAM 投影同步状态
      description: |
        仅 `PLATFORM_ADMIN`、IAM 投影运维职责或审计职责可查询。仅返回脱敏的运行摘要、计数、来源版本和审计关联，
        不返回连接串、令牌、原始 IAM 载荷、完整失败记录或个人信息。
      operationId: getIdentityProjectionSyncJob
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/SyncJobId'
      responses:
        '200':
          description: 已授权的同步任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /security/csrf:
    get:
      tags: [Security]
      summary: 获取当前会话的 CSRF 令牌
      operationId: getCsrfToken
      responses:
        '200':
          description: 仅对当前会话有效的 CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /security/session:
    delete:
      tags: [Security]
      summary: 注销当前会话
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 会话已失效；重复调用同样视为成功。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets:
    get:
      tags: [Tickets]
      summary: 在当前数据范围内查询工单
      description: 服务端忽略或拒绝越出当前授权范围的组织、队列、人员等筛选条件；不会依赖前端过滤。
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: q
          in: query
          description: 关键词；服务端执行长度限制、转义和权限过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: 已按数据范围过滤的分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Tickets]
      summary: 创建工单
      description: 以当前认证身份作为提单人。requesterId、组织、优先级、队列、状态和处理人均不得由客户端指定。
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: 工单已创建
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: 新工单相对地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: 获取单张工单
      description: 详情、评论、附件及关联信息需逐对象重新授权；无权访问时不得借由错误消息泄露对象存在性。
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 已授权的工单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/actions:
    post:
      tags: [Workflow]
      summary: 执行工单生命周期动作
      description: |
        覆盖提交、分类、分派、受理、开始处理、待用户反馈、解决、关闭、重开、撤销、挂起、恢复和升级。
        客户端仅表达动作意图及结构化业务事实；服务端逐对象校验身份、数据范围、当前状态、流程节点、候选人、审批策略和 SLA 影响，
        并决定是否创建审批任务或拒绝动作。客户端不得指定目标状态、流程变量、审批结论、优先级、队列或处理人。
      operationId: executeTicketAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketActionRequest'
      responses:
        '200':
          description: 动作已立即完成，或已按规则创建后续审批/流程任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/work-actions:
    post:
      tags: [Collaboration]
      summary: 执行转办、协办、抢单、主办指定或交接班
      description: |
        覆盖转办、添加/移除协办、抢单、指定主办与交接班。targetIamUserId 仅是候选目标，
        服务端必须验证该人员 IAM 投影有效、班次/技能/队列/组织数据范围、当前任务候选资格和审批要求；
        不能通过请求体变更提交人、角色、队列、流程受让人或历史身份快照。
      operationId: executeTicketWorkAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketWorkActionRequest'
      responses:
        '200':
          description: 协同关系或任务受让人已更新，或已创建审批任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow-tasks:
    get:
      tags: [Workflow]
      summary: 查询当前主体可操作或可见的 BPMN 任务
      description: |
        仅返回当前工单上、当前主体为受让人/候选人/受限观察者的活动 Flowable 任务；服务端按工单关系、任务可见性、
        流程定义版本和数据范围过滤。任务 ID、流程节点或候选资格只用于定位，绝不构成授权，且不能通过分页枚举其他候选人。
        会签以多实例任务表达：响应只返回当前主体所需的会签进度摘要，不泄露无权参与人的身份或审批意见。
      operationId: listTicketWorkflowTasks
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体可见的活动 BPMN 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/workflow-tasks/{taskId}/actions:
    post:
      tags: [Workflow]
      summary: 执行当前 Flowable 用户任务动作
      description: |
        用于受控抢单、释放、完成、委派及会签参与人增减/完成。服务端以 `ticketId`、`taskId`、当前流程实例与定义版本交叉验证，
        再校验候选人/受让人、任务状态、数据范围、审批策略、工单 version 和 taskVersion；客户端不能借此设置流程变量、
        直接审批自己发起的事项、替他人完成任务或改变流程节点。会签数量、完成条件及结束策略仅由已发布 BPMN/服务端规则决定。
      operationId: executeTicketWorkflowTaskAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowTaskId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTaskActionRequest'
      responses:
        '200':
          description: 任务动作已完成，或服务端已创建后续任务/审批；响应不暴露未授权候选人。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/internal-comments:
    get:
      tags: [Comments]
      summary: 查询已授权的内部评论
      description: 服务端按工单对象权限、当前协作关系和评论可见范围过滤；提单人及无内部协作权限人员不能据此枚举评论或人员信息。
      operationId: listTicketInternalComments
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体可见的内部评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: 添加内部评论
      description: |
        仅对有当前工单处理关系且具备内部协作权限的人员开放。评论内容服务端净化、脱敏和审计；
        internal 标记由接口固定，不接受客户端将评论公开给提单人或变更工单状态。
      operationId: createTicketInternalComment
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInternalCommentRequest'
      responses:
        '201':
          description: 内部评论已保存并写入审计链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/controlled-jump-requests:
    post:
      tags: [Workflow]
      summary: 发起受控流程跳转申请
      description: |
        仅为纠偏、应急或迁移提出申请，绝不直接跳转。服务端验证来源任务、流程定义版本、节点白名单、硬审批/授权节点、
        数据范围、任务处置、审批策略与 SLA 影响；通过后才创建审批和受控执行任务。任何跳转均写入不可篡改审计链。
      operationId: requestControlledTicketJump
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlledJumpRequest'
      responses:
        '202':
          description: 跳转申请已受理；不表示跳转已执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-catalog/items:
    get:
      tags: [ServiceCatalog]
      summary: 查询当前主体可见的已发布服务目录
      description: |
        仅返回已发布且当前 IAM 身份、组织、服务数据范围可申请的目录项。服务端过滤停用、草稿和无权目录；
        不得以筛选、分页或 ID 探测枚举其他部门服务。目录路由、审批、优先级与 SLA 仅作展示预览，建单时仍由服务端重新计算。
      operationId: listPublishedServiceCatalogItems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ticketType
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: categoryCode
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 当前主体可申请的已发布服务目录分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogItemPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /service-catalog/items/{serviceCatalogItemId}/form:
    get:
      tags: [ServiceCatalog]
      summary: 获取已发布目录项的动态建单表单
      description: |
        返回当前主体可见目录项的不可变已发布版本、字段定义、允许字典和脱敏展示规则；不返回草稿、内部路由条件、脚本或规则表达式。
        前端按此渲染，服务端在建单和规则匹配时以同一已发布版本重新校验字段、联动、数据范围和字典值。
      operationId: getPublishedServiceCatalogForm
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
      responses:
        '200':
          description: 已授权的已发布动态表单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedServiceCatalogForm'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-catalog/dictionaries/{dictionaryCode}/entries:
    get:
      tags: [ServiceCatalog]
      summary: 查询动态表单可用字典项
      description: |
        仅用于已发布表单中声明的字典字段。服务端依据字段、目录版本及当前数据范围过滤有效项；
        dictionaryCode 不是授权凭据，未知、未发布或无权字典按防枚举策略处理。不得返回维护备注、内部映射或被禁用值。
      operationId: listPublishedDictionaryEntries
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
        - name: serviceCatalogItemId
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: formVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fieldCode
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: dependsOn
          in: query
          description: JSON 编码的已允许联动字段值；服务端只读取表单中声明的依赖字段，拒绝未知/敏感字段。
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: 已授权且有效的字典项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-catalog/rule-matches:
    post:
      tags: [RuleMatching]
      summary: 建单前确定性规则案例匹配
      description: |
        只执行已发布的目录、CI、结构化字段、标准标签、错误码和关键词规则，返回可见的已解决案例/知识摘要；
        当前不包含 AI、向量检索、语音、自动处置或自动建单。建议仅供用户参考，不能改变工单路由、优先级、审批或权限。
        服务端以已发布表单重新验证提交字段，忽略客户端声称的匹配分、规则 ID 或案例可见性。
      operationId: matchPreSubmissionRules
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleMatchRequest'
      responses:
        '200':
          description: 当前主体可见的确定性规则建议；空数组表示未匹配，不代表故障不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleMatchResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/service-catalog/items:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询当前管理范围内的服务目录草稿和发布版本
      description: 仅服务目录管理职责且具备相应组织/服务数据范围者可见；查询结果不得跨范围泄露草稿、内部规则、候选人或服务配置。
      operationId: listManagedServiceCatalogItems
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ServiceCatalogLifecycleStatus'
      responses:
        '200':
          description: 已按管理数据范围过滤的目录版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItemPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ServiceCatalogAdmin]
      summary: 创建受控服务目录草稿
      description: |
        仅创建草稿；不得以此直接发布或修改其他范围目录。服务端验证管理角色、组织/服务范围、字段规范、字典引用、标签策略和受管规则来源，
        对每次写入固化身份快照、前后摘要和审计链。请求不能携带脚本、表达式、路由执行代码、审批结论或任意候选人名单。
      operationId: createServiceCatalogDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogDraftUpsertRequest'
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/items/{serviceCatalogItemId}:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 获取受控目录草稿或发布版本
      description: 管理接口逐对象验证当前管理数据范围；响应仅返回满足职责所需的配置摘要，敏感路由/审批实现细节须按最小权限脱敏。
      operationId: getManagedServiceCatalogItem
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
      responses:
        '200':
          description: 已授权的管理配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ServiceCatalogAdmin]
      summary: 更新受控服务目录草稿
      description: 只允许更新当前主体管理范围内的草稿，须携带乐观锁版本；发布版本不可原地修改，须复制为新草稿。服务端最终校验字段、字典、标签、规则和数据范围。
      operationId: updateServiceCatalogDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogDraftUpsertRequest'
      responses:
        '200':
          description: 草稿已更新并记录审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/items/{serviceCatalogItemId}/publish-requests:
    post:
      tags: [ServiceCatalogAdmin]
      summary: 提交服务目录发布申请
      description: |
        发布申请不是直接发布。服务端冻结候选草稿版本，重新校验引用字典、字段、联动、标签策略和规则来源，按策略创建复核/审批任务；
        申请人不得审批自己的变更。审批完成前，运行中建单与规则匹配仍只使用最后一份已发布版本。
      operationId: requestServiceCatalogPublication
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogPublishRequest'
      responses:
        '202':
          description: 发布复核/审批已创建；不表示草稿已生效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogPublishRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/dictionaries/{dictionaryCode}:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询受控字典定义及条目
      description: 仅返回当前管理数据范围内的字典；不得借此枚举跨组织服务、内部映射或已删除历史值。
      operationId: getManagedDictionary
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
      responses:
        '200':
          description: 已授权的字典定义
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDictionary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ServiceCatalogAdmin]
      summary: 更新受控字典草稿
      description: |
        字典只允许受控管理者按范围创建或维护草稿；条目编码不可被重用为其他语义，已被发布表单引用的条目不得静默删除或变义。
        服务端校验重复、层级/联动引用、适用范围与版本，并审计前后摘要；字典变更须走发布复核，不能通过前端缓存直接生效。
      operationId: updateManagedDictionaryDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedDictionaryUpsertRequest'
      responses:
        '200':
          description: 字典草稿已更新并待受控发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDictionary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/tags:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询标准标签策略
      description: 标准标签仅返回当前主体有权维护或使用的范围；禁止通过标签查询泄露问题、系统、组织或敏感业务名称。
      operationId: listManagedStandardTags
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: 已授权标准标签分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTagPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ServiceCatalogAdmin]
      summary: 创建标准标签草稿
      description: |
        只接受规范化的展示名和受控适用范围；服务端执行 Unicode 规范化、去重、保留词、长度和 XSS/控制字符校验。
        不允许以标签内容注入 HTML、脚本、链接、路由规则、数据范围或用户可见性；发布前需复核和不可篡改审计。
      operationId: createStandardTagDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardTagUpsertRequest'
      responses:
        '201':
          description: 标准标签草稿已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTag'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICEHUB_SESSION
      description: 由 Spring Boot 维护的 HttpOnly、Secure、SameSite 会话 Cookie；浏览器不得将访问令牌写入 localStorage。
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 对所有非安全方法必传；令牌绑定当前会话。
      schema:
        type: string
        minLength: 20
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端为一次写入意图生成的 UUID。服务端将键绑定到认证主体、接口、目标工单/任务和规范化请求指纹；
        同一绑定在受控保留期内仅执行一次并返回原结果，使用相同键但不同指纹必须返回 IDEMPOTENCY_CONFLICT。
        键不可跨主体、工单、任务或操作复用，且服务端记录首次接收时间、结果和审计关联以防重放。
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
    WorkflowTaskId:
      name: taskId
      in: path
      required: true
      description: Flowable 用户任务引用；仅作定位，服务端仍须验证工单、流程实例、当前节点及当前主体的任务关系。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^IAMSYNC-[A-Za-z0-9_-]{8,64}$'
    ServiceCatalogItemId:
      name: serviceCatalogItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
    DictionaryCode:
      name: dictionaryCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{1,62}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationFailed:
      description: 请求字段或服务目录规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: 会话不存在、过期或 IAM 身份不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 已认证但不具备当前对象、动作或数据范围权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 对象不存在或按防枚举策略不可见
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等键冲突、状态冲突或乐观锁冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 请求频率超过当前主体或来源限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 服务暂不可接收流量
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [UP]
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          maxLength: 64
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, authorization]
      properties:
        user:
          $ref: '#/components/schemas/UserProjection'
        authorization:
          type: object
          additionalProperties: false
          required: [roles, dataScopes, projectionVersion]
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/PlatformRole'
            dataScopes:
              type: array
              description: 用于 UI 提示，后端仍必须在每次请求实时计算并校验。
              items:
                $ref: '#/components/schemas/DataScopeSummary'
            projectionVersion:
              type: string
              maxLength: 128
              description: 当前 IAM 投影版本，仅用于界面刷新提示；不能作为授权、并发控制或历史身份依据。
    UserProjection:
      type: object
      additionalProperties: false
      required: [iamUserId, displayName, status, organization, positions, candidateSummary, projectionVersion]
      properties:
        iamUserId:
          type: string
          maxLength: 128
          description: IAM 不可变用户标识
        displayName:
          type: string
          maxLength: 100
        loginName:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        organizationPath:
          type: array
          maxItems: 32
          description: 当前归属组织的根至叶路径，仅返回调用人有权查看的节点。
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        positions:
          type: array
          maxItems: 20
          description: IAM 同步的岗位摘要；无岗位时返回空数组，不以本地字段补齐。
          items:
            $ref: '#/components/schemas/PositionSummary'
        candidateSummary:
          $ref: '#/components/schemas/CandidateSummary'
        projectionVersion:
          type: string
          maxLength: 128
          description: 此用户投影的来源版本或成功同步批次；不等同于业务身份快照版本。
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [iamOrganizationId, name]
      properties:
        iamOrganizationId:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
    OrganizationProjection:
      type: object
      additionalProperties: false
      required: [iamOrganizationId, code, name, status, path, projectionVersion]
      properties:
        iamOrganizationId:
          type: string
          maxLength: 128
          description: IAM 不可变组织标识
        code:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
        parentIamOrganizationId:
          type: string
          maxLength: 128
          description: 根组织可省略；服务端仅返回当前范围内可见的父组织引用。
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        path:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        projectionVersion:
          type: string
          maxLength: 128
          description: 来源 IAM 版本或成功同步批次。
        lastSyncedAt:
          type: string
          format: date-time
    OrganizationProjectionPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationProjection'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    PositionSummary:
      type: object
      additionalProperties: false
      required: [iamPositionId, name, status]
      properties:
        iamPositionId:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    CandidateSummary:
      type: object
      additionalProperties: false
      required: [eligible, platformRoles, dataScopes]
      properties:
        eligible:
          type: boolean
          description: 对传入 candidateFor 场景的服务端计算结果；未传场景时表示基础投影可用性，并不授予受让权。
        platformRoles:
          type: array
          maxItems: 20
          description: 当前平台映射角色摘要；仅用于候选提示，执行动作时必须实时复核。
          items:
            $ref: '#/components/schemas/PlatformRole'
        dataScopes:
          type: array
          maxItems: 100
          description: 已脱敏的当前数据范围摘要；服务端不因本字段而放宽对象级授权。
          items:
            $ref: '#/components/schemas/DataScopeSummary'
    UserProjectionPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProjection'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    DataScopeSummary:
      type: object
      additionalProperties: false
      required: [scopeType, scopeId, accessLevel]
      properties:
        scopeType:
          type: string
          enum: [ORGANIZATION, SERVICE, QUEUE, CONFIGURATION_ITEM]
        scopeId:
          type: string
          maxLength: 128
        accessLevel:
          type: string
          enum: [SELF, DIRECT, DESCENDANTS, ASSIGNED, MANAGED]
        scopeName:
          type: string
          maxLength: 200
          description: 可选展示摘要；不应包含无权查看的组织层级、CI 或业务敏感信息。
    PlatformRole:
      type: string
      enum: [REQUESTER, FIRST_LINE_SUPPORT, SECOND_LINE_SUPPORT, APPROVER, SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
    IdentitySyncTriggerRequest:
      type: object
      additionalProperties: false
      required: [mode, reason]
      x-server-enforced:
        - administrator-or-iam-operations-authorization
        - configured-connector-only
        - single-flight-or-idempotent-scheduling
        - immutable-audit-event
      properties:
        mode:
          type: string
          enum: [INCREMENTAL, FULL]
          description: FULL 同步受服务端频率、维护窗口和容量策略约束；不能由请求绕过。
        reason:
          type: string
          minLength: 4
          maxLength: 500
          description: 受控触发理由；服务端脱敏、审计。不得填写连接串、密码、令牌或完整个人信息。
    IdentitySyncJob:
      type: object
      additionalProperties: false
      required: [id, mode, status, requestedAt, requestedBy, auditEventId]
      properties:
        id:
          type: string
          pattern: '^IAMSYNC-[A-Za-z0-9_-]{8,64}$'
        mode:
          type: string
          enum: [INCREMENTAL, FULL]
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED, CANCELLED]
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        requestedBy:
          $ref: '#/components/schemas/IdentitySnapshot'
        sourceVersion:
          type: string
          maxLength: 128
          description: 可公开的 IAM 来源版本/游标摘要；不得包含连接信息、令牌或原始载荷。
        result:
          $ref: '#/components/schemas/IdentitySyncResultSummary'
        auditEventId:
          type: string
          maxLength: 128
    IdentitySyncResultSummary:
      type: object
      additionalProperties: false
      required: [organizationsRead, usersRead, rejectedRecords, sensitiveDetailAvailable]
      properties:
        organizationsRead:
          type: integer
          minimum: 0
        usersRead:
          type: integer
          minimum: 0
        rejectedRecords:
          type: integer
          minimum: 0
        sensitiveDetailAvailable:
          type: boolean
          const: false
          description: 接口不返回原始失败记录、个人信息或 IAM 载荷；受管审计系统按最小权限留存必要证据。
        failureCode:
          type: string
          maxLength: 80
          description: 仅返回稳定、脱敏错误码；不返回堆栈、连接地址或认证失败细节。
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
    TicketType:
      type: string
      enum: [INCIDENT, SERVICE_REQUEST, ACCESS_REQUEST, PROBLEM, CHANGE]
    TicketStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_CLASSIFICATION, PENDING_ASSIGNMENT, PENDING_ACCEPTANCE, IN_PROGRESS, RESOLVED, PENDING_USER_FEEDBACK, CLOSED, CANCELLED, ON_HOLD]
    TicketAction:
      type: string
      description: 生命周期动作；动作后的状态、优先级、队列、审批和 SLA 均由服务端规则计算。
      enum: [SUBMIT, CLASSIFY, ASSIGN, ACCEPT, START_PROCESSING, REQUEST_USER_FEEDBACK, RESOLVE, CLOSE, REOPEN, CANCEL, HOLD, RESUME, ESCALATE]
    TicketWorkAction:
      type: string
      description: 多人处理动作；目标人员仅是候选输入，不构成授权或直接受让。
      enum: [TRANSFER, ADD_COLLABORATOR, REMOVE_COLLABORATOR, CLAIM, APPOINT_PRIMARY, HANDOVER_SHIFT, REQUEST_COUNTERSIGN]
    WorkflowTaskAction:
      type: string
      description: |
        仅对当前活动 Flowable 用户任务生效。CLAIM/RELEASE 处理候选任务的受让，DELEGATE 是受控委派，
        ADD/REMOVE_COUNTERSIGNER 只能按已发布会签策略增减参与人，COMPLETE/COMPLETE_COUNTERSIGN 由服务端推进 BPMN。
      enum: [CLAIM, RELEASE, COMPLETE, DELEGATE, ADD_COUNTERSIGNER, REMOVE_COUNTERSIGNER, COMPLETE_COUNTERSIGN]
    WorkflowTaskKind:
      type: string
      enum: [USER_TASK, APPROVAL_TASK, COUNTERSIGN_TASK, SERVICE_TASK_WAIT]
    WorkflowTaskAccess:
      type: string
      description: 当前主体与该任务的服务端计算关系；不是可转发的授权凭据。
      enum: [ASSIGNEE, CANDIDATE, OBSERVER]
    TicketPriority:
      type: string
      enum: [P1, P2, P3, P4]
    ServiceCatalogLifecycleStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, RETIRED, REJECTED]
    FormFieldType:
      type: string
      description: 不支持可执行脚本、HTML、任意 SQL/表达式或客户端定义组件。附件、人员、CI 等特殊字段须使用各自受控契约，不能借动态表单绕过授权。
      enum: [TEXT, TEXTAREA, NUMBER, DATE, DATETIME, BOOLEAN, SINGLE_SELECT, MULTI_SELECT, RADIO, CHECKBOX_GROUP, ERROR_CODE, TAGS]
    FieldSensitivity:
      type: string
      enum: [INTERNAL, SENSITIVE]
    FieldMaskingRule:
      type: string
      description: 输出脱敏规则；是否可见和是否可填仍由服务端按数据范围、用途和流程节点决定。
      enum: [NONE, PARTIAL, FULL]
    FormConditionOperator:
      type: string
      enum: [EQUALS, NOT_EQUALS, IN, NOT_IN, HAS_VALUE, NO_VALUE]
    FormCondition:
      type: object
      additionalProperties: false
      required: [fieldCode, operator]
      properties:
        fieldCode:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: 只能引用同一已发布表单中位于当前字段之前的非敏感字段。
        operator:
          $ref: '#/components/schemas/FormConditionOperator'
        values:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 200
          description: HAS_VALUE/NO_VALUE 时省略；服务端以字典编码或规范值比对，不解释表达式。
    FormFieldValidation:
      type: object
      additionalProperties: false
      properties:
        minLength:
          type: integer
          minimum: 0
          maximum: 4000
        maxLength:
          type: integer
          minimum: 1
          maximum: 4000
        minimum:
          type: number
        maximum:
          type: number
        patternCode:
          type: string
          maxLength: 64
          description: 服务端内置、已审核的格式规则编码；不接受前端提交正则或脚本。
        allowedFileExtensions:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^\.[A-Za-z0-9]{1,10}$'
          description: 仅为受控附件字段的显示摘要；实际上传隔离、扫描和对象授权由附件接口负责。
    FormField:
      type: object
      additionalProperties: false
      required: [code, label, type, required, displayOrder, sensitivity, masking]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: 纯文本标签；服务端输出编码，前端不得以 v-html 或等价方式渲染。
        helpText:
          type: string
          maxLength: 300
          description: 纯文本帮助；不含令牌、连接串、内部路由和 HTML。
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
        displayOrder:
          type: integer
          minimum: 1
          maximum: 500
        dictionaryCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,62}$'
          description: SELECT/RADIO/CHECKBOX_GROUP 必填；服务端验证字典已发布、字段可用性及联动后的允许值。
        validation:
          $ref: '#/components/schemas/FormFieldValidation'
        visibleWhen:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FormCondition'
          description: 所有条件同时满足才显示；联动仅支持受控比较，不支持脚本或自由表达式。
        requiredWhen:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FormCondition'
        sensitivity:
          $ref: '#/components/schemas/FieldSensitivity'
        masking:
          $ref: '#/components/schemas/FieldMaskingRule'
        allowRuleMatching:
          type: boolean
          default: false
          description: 是否允许该字段作为确定性案例匹配输入；SENSITIVE 字段默认且必须为 false，除非服务端批准例外并记录审计。
    FormData:
      type: object
      description: |
        字段键仅限指定目录表单版本的 FormField.code；服务端拒绝未知、隐藏/无权、只读、类型不符、无效字典值及未满足联动的字段。
        该开放对象只为适配受控动态表单，不能承载状态、角色、人员、组织、队列、优先级、审批、路由、SLA 或任意流程变量。
      additionalProperties: true
    TagPolicy:
      type: object
      additionalProperties: false
      required: [allowStandardTags, allowFreeTags, maxTags]
      properties:
        allowStandardTags:
          type: boolean
        allowFreeTags:
          type: boolean
        maxTags:
          type: integer
          minimum: 0
          maximum: 20
        allowedStandardTagCodes:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^TAG-[A-Za-z0-9_-]{3,60}$'
          description: 空数组表示无目录白名单；标准标签是否可用仍由服务端按当前范围决定。
    ServiceCatalogItem:
      type: object
      additionalProperties: false
      required: [id, code, name, ticketType, categoryCode, publishedVersion, formSchemaHash]
      properties:
        id:
          type: string
          pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        ticketType:
          $ref: '#/components/schemas/TicketType'
        categoryCode:
          type: string
          maxLength: 64
        publishedVersion:
          type: integer
          minimum: 1
        formSchemaHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
          description: 已发布表单定义摘要，用于前端缓存失效提示；建单仍以服务端表单版本为准。
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/StandardTag'
    ServiceCatalogItemPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogItem'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    PublishedServiceCatalogForm:
      type: object
      additionalProperties: false
      required: [serviceCatalogItem, formVersion, formSchemaHash, fields, tagPolicy]
      properties:
        serviceCatalogItem:
          $ref: '#/components/schemas/ServiceCatalogItem'
        formVersion:
          type: integer
          minimum: 1
        formSchemaHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/FormField'
        tagPolicy:
          $ref: '#/components/schemas/TagPolicy'
        publishedAt:
          type: string
          format: date-time
    DictionaryEntry:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 120
          description: 纯文本展示值；服务端输出编码，禁止使用 HTML 作为字典标签。
        parentCode:
          type: string
          maxLength: 64
        displayOrder:
          type: integer
          minimum: 1
          maximum: 100000
    DictionaryEntryPage:
      type: object
      additionalProperties: false
      required: [items, formVersion]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DictionaryEntry'
        formVersion:
          type: integer
          minimum: 1
    RuleMatchRequest:
      type: object
      additionalProperties: false
      required: [serviceCatalogItemId, formVersion, structuredFields]
      x-server-enforced:
        - published-catalog-and-form-version-check
        - dynamic-form-field-and-dictionary-validation
        - subject-data-scope-and-case-visibility
        - deterministic-rule-source-and-version
        - rate-limit-and-immutable-audit-event
      properties:
        serviceCatalogItemId:
          type: string
          pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
        formVersion:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          description: 可选的纯文本补充；服务端规范化、脱敏并仅使用已发布关键词规则，不发送至外部 AI 或向量服务。
        structuredFields:
          $ref: '#/components/schemas/FormData'
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Tag'
        relatedConfigurationItemIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
    RuleMatch:
      type: object
      additionalProperties: false
      required: [ruleCode, matchedFacts, suggestion]
      properties:
        ruleCode:
          type: string
          maxLength: 64
          description: 已发布规则的稳定、非敏感编码；不返回内部条件、权重、脚本或可改写的规则表达式。
        matchedFacts:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 160
          description: 脱敏后的命中事实摘要；不得回显 SENSITIVE 字段或其他用户数据。
        suggestion:
          $ref: '#/components/schemas/CaseSuggestion'
    CaseSuggestion:
      type: object
      additionalProperties: false
      required: [kind, title, summary, action]
      properties:
        kind:
          type: string
          enum: [KNOWLEDGE_ARTICLE, RESOLVED_CASE]
        referenceId:
          type: string
          maxLength: 128
          description: 仅在当前主体具备查看权时返回；无权案例不得以 ID、标题、计数或匹配提示泄露存在性。
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
          description: 已脱敏的纯文本摘要，不含历史工单个人信息、内部评论、附件或处理人信息。
        action:
          type: string
          enum: [READ_AND_TRY, CONTINUE_CREATE]
          description: 仅供用户选择；不会自动关闭、更新、合并或处置工单。
    RuleMatchResponse:
      type: object
      additionalProperties: false
      required: [ruleEngine, matches]
      properties:
        ruleEngine:
          type: string
          const: DETERMINISTIC_RULES
        matches:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RuleMatch'
    ServiceCatalogDraftUpsertRequest:
      type: object
      additionalProperties: false
      required: [version, code, name, ticketType, categoryCode, fields, tagPolicy, reason]
      x-server-enforced:
        - service-manager-role-and-data-scope
        - catalog-version-and-optimistic-lock-check
        - field-schema-and-dictionary-reference-validation
        - no-script-or-executable-rule-content
        - four-eyes-publication-policy
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        ticketType:
          $ref: '#/components/schemas/TicketType'
        categoryCode:
          type: string
          maxLength: 64
        applicableOrganizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 128
          description: 仅可选择当前主体已管理的 IAM 组织投影；服务端验证其闭包范围，不信任客户端范围声明。
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/FormField'
        tagPolicy:
          $ref: '#/components/schemas/TagPolicy'
        reason:
          type: string
          minLength: 4
          maxLength: 500
    ManagedServiceCatalogItem:
      type: object
      additionalProperties: false
      required: [serviceCatalogItem, formVersion, formSchemaHash, fields, tagPolicy, lifecycleStatus, version, auditEventId]
      properties:
        serviceCatalogItem:
          $ref: '#/components/schemas/ServiceCatalogItem'
        formVersion:
          type: integer
          minimum: 1
        formSchemaHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/FormField'
        tagPolicy:
          $ref: '#/components/schemas/TagPolicy'
        lifecycleStatus:
          $ref: '#/components/schemas/ServiceCatalogLifecycleStatus'
        version:
          type: integer
          minimum: 0
        applicableOrganizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 128
        auditEventId:
          type: string
          maxLength: 128
    ManagedServiceCatalogItemPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedServiceCatalogItem'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ServiceCatalogPublishRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 4
          maxLength: 500
    ServiceCatalogPublishRequestResult:
      type: object
      additionalProperties: false
      required: [requestId, status, auditEventId]
      properties:
        requestId:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [PENDING_REVIEW]
        auditEventId:
          type: string
          maxLength: 128
    ManagedDictionaryUpsertRequest:
      type: object
      additionalProperties: false
      required: [version, name, entries, reason]
      properties:
        version:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 2
          maxLength: 120
        entries:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/DictionaryEntry'
        reason:
          type: string
          minLength: 4
          maxLength: 500
    ManagedDictionary:
      type: object
      additionalProperties: false
      required: [code, name, version, lifecycleStatus, entries, auditEventId]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,62}$'
        name:
          type: string
          maxLength: 120
        version:
          type: integer
          minimum: 0
        lifecycleStatus:
          $ref: '#/components/schemas/ServiceCatalogLifecycleStatus'
        entries:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/DictionaryEntry'
        auditEventId:
          type: string
          maxLength: 128
    StandardTagUpsertRequest:
      type: object
      additionalProperties: false
      required: [code, name, reason]
      properties:
        code:
          type: string
          pattern: '^TAG-[A-Za-z0-9_-]{3,60}$'
        name:
          type: string
          pattern: '^#[^\\s#<>]{1,50}$'
          description: 标准展示标签；服务端 Unicode 规范化后去重，禁止 HTML、控制字符和链接。
        applicableOrganizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 128
        reason:
          type: string
          minLength: 4
          maxLength: 500
    StandardTag:
      type: object
      additionalProperties: false
      required: [code, name, lifecycleStatus]
      properties:
        code:
          type: string
          pattern: '^TAG-[A-Za-z0-9_-]{3,60}$'
        name:
          type: string
          pattern: '^#[^\\s#<>]{1,50}$'
        lifecycleStatus:
          $ref: '#/components/schemas/ServiceCatalogLifecycleStatus'
    StandardTagPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StandardTag'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    Tag:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          pattern: '^#[^\\s#]{1,50}$'
          description: 自由标签必须以 # 开头；标准标签同样按此格式展示。
        kind:
          type: string
          enum: [STANDARD, FREE]
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required: [serviceCatalogItemId, serviceCatalogFormVersion, type, title, description, structuredFields]
      x-server-enforced:
        - authenticated-requester-identity-snapshot
        - published-catalog-visibility-and-form-version-check
        - dynamic-form-field-type-linkage-and-dictionary-validation
        - tag-policy-and-normalization
        - service-side-routing-priority-approval-and-sla-calculation
      properties:
        serviceCatalogItemId:
          type: string
          maxLength: 64
          description: 服务目录项 ID；后端以此加载必填项、路由、审批与 SLA 规则。
        serviceCatalogFormVersion:
          type: integer
          minimum: 1
          description: 用户实际填写时看到的已发布表单版本。版本过期、目录不可见或表单摘要不一致时由服务端拒绝或要求刷新，不能回退至草稿。
        type:
          $ref: '#/components/schemas/TicketType'
        title:
          type: string
          minLength: 4
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          description: 自然语言补充；服务端清洗、脱敏和长度校验。
        structuredFields:
          $ref: '#/components/schemas/FormData'
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Tag'
        relatedConfigurationItemIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
    TicketActionRequest:
      type: object
      additionalProperties: false
      required: [action, version, reason, structuredFields]
      x-server-enforced:
        - object-authorization
        - process-node-and-candidate-check
        - approval-policy
        - workflow-transition
        - sla-impact-calculation
        - immutable-audit-event
      properties:
        action:
          $ref: '#/components/schemas/TicketAction'
        version:
          type: integer
          minimum: 0
          description: 客户端读取到的工单乐观锁版本；不一致时返回 VERSION_CONFLICT，服务端绝不覆盖。
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 必填的操作理由；服务端清洗、脱敏并写入审计摘要。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: |
            仅允许当前服务目录、动作与流程节点已发布定义中的结构化字段，例如分类依据、解决码、挂起原因、升级级别或用户反馈期限。
            禁止传入状态、流程变量、审批人结论、SLA 截止时间、优先级、队列、提交人和处理人；服务端采用字段白名单校验。
    WorkflowDecision:
      type: object
      additionalProperties: false
      required: [outcome, workflowInstanceId, currentNodeCode, auditEventId]
      properties:
        outcome:
          type: string
          enum: [COMPLETED, PENDING_APPROVAL, PENDING_PROCESS_TASK]
          description: 由服务端决策；PENDING_APPROVAL 不表示审批已通过。
        workflowInstanceId:
          type: string
          maxLength: 128
        currentNodeCode:
          type: string
          maxLength: 128
        approvalTaskId:
          type: string
          maxLength: 128
          description: 仅在服务端创建审批任务时返回；ID 不能替代对象级授权。
        auditEventId:
          type: string
          maxLength: 128
    SlaImpact:
      type: object
      additionalProperties: false
      required: [calculatedByServer, impact]
      properties:
        calculatedByServer:
          type: boolean
          const: true
        impact:
          type: string
          enum: [NONE, PAUSED, RESUMED, RECALCULATED, BREACH_RISK]
        targetAt:
          type: string
          format: date-time
          description: 服务端计算后的目标时间；仅在当前主体有查看该 SLA 信息的权限时返回。
    TicketActionResult:
      type: object
      additionalProperties: false
      required: [ticket, decision, slaImpact]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        slaImpact:
          $ref: '#/components/schemas/SlaImpact'
    TicketWorkActionRequest:
      type: object
      additionalProperties: false
      required: [action, version, reason, structuredFields]
      x-server-enforced:
        - object-authorization
        - target-identity-projection-and-skill-check
        - current-task-candidate-check
        - approval-policy
        - workflow-assignment
        - countersign-policy-and-multi-instance-check
        - anti-replay-binding
        - immutable-audit-event
      properties:
        action:
          $ref: '#/components/schemas/TicketWorkAction'
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        targetIamUserId:
          type: string
          maxLength: 128
          description: 转办、增加/移除协办、指定主办、交接班或请求会签的候选目标；抢单时忽略，服务端以当前主体为候选人。服务端验证其为当前流程/服务范围内有效候选人。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 仅允许动作定义的班次、技能、交接清单、协办职责或会签范围字段；不得传入流程受让人、角色、组织范围、会签完成条件或流程变量。
    TicketParticipant:
      type: object
      additionalProperties: false
      required: [role, identity, assignedAt]
      properties:
        role:
          type: string
          enum: [PRIMARY, COLLABORATOR, COUNTERSIGNER]
        identity:
          $ref: '#/components/schemas/IdentitySnapshot'
        assignedAt:
          type: string
          format: date-time
    TicketWorkActionResult:
      type: object
      additionalProperties: false
      required: [ticket, decision, participants]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        participants:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TicketParticipant'
    WorkflowTask:
      type: object
      additionalProperties: false
      required: [id, taskDefinitionKey, kind, processDefinitionKey, processDefinitionVersion, taskVersion, access, createdAt]
      properties:
        id:
          type: string
          maxLength: 128
          description: Flowable 任务引用；服务端仍须验证该任务属于路径中的工单及当前流程实例。
        taskDefinitionKey:
          type: string
          maxLength: 128
          description: 已发布 BPMN 定义的任务节点键；不得由客户端用于任意跳转。
        kind:
          $ref: '#/components/schemas/WorkflowTaskKind'
        processDefinitionKey:
          type: string
          maxLength: 128
        processDefinitionVersion:
          type: integer
          minimum: 1
        taskVersion:
          type: integer
          minimum: 0
          description: Flowable 任务/平台任务的乐观锁版本；任务写操作必须同时提交此值与工单 version。
        access:
          $ref: '#/components/schemas/WorkflowTaskAccess'
        assignee:
          $ref: '#/components/schemas/IdentitySnapshot'
        candidateCount:
          type: integer
          minimum: 0
          description: 仅返回计数，避免无权用户枚举任务候选人；实际资格在执行时重新计算。
        countersignProgress:
          $ref: '#/components/schemas/CountersignProgress'
        createdAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: 服务端计算且按数据范围脱敏后的任务到期时间。
    CountersignProgress:
      type: object
      additionalProperties: false
      required: [mode, requiredCount, completedCount, pendingCount]
      properties:
        mode:
          type: string
          enum: [ALL_REQUIRED, QUORUM_REQUIRED]
        requiredCount:
          type: integer
          minimum: 1
        completedCount:
          type: integer
          minimum: 0
        pendingCount:
          type: integer
          minimum: 0
        canCurrentUserComplete:
          type: boolean
          description: 仅是当前读取时的服务端提示；提交时仍重新鉴权并校验任务版本。
    WorkflowTaskPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTask'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    WorkflowTaskActionRequest:
      type: object
      additionalProperties: false
      required: [action, version, taskVersion, reason, structuredFields]
      x-server-enforced:
        - ticket-object-authorization
        - task-to-ticket-and-process-instance-binding
        - process-definition-version-and-bpmn-node-check
        - assignee-candidate-and-delegation-check
        - countersign-policy-and-multi-instance-check
        - approval-separation-of-duties
        - ticket-and-task-optimistic-lock
        - subject-operation-target-request-fingerprint-anti-replay
        - immutable-audit-event
      properties:
        action:
          $ref: '#/components/schemas/WorkflowTaskAction'
        version:
          type: integer
          minimum: 0
          description: 当前工单乐观锁版本；与 taskVersion 同时校验，任一冲突均不能推进流程。
        taskVersion:
          type: integer
          minimum: 0
          description: 当前 Flowable/平台任务乐观锁版本；抢单、释放、委派、会签和完成均须校验。
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 动作理由；服务端脱敏、固化身份快照并写入审计摘要。
        targetIamUserId:
          type: string
          maxLength: 128
          description: 仅 DELEGATE、ADD_COUNTERSIGNER、REMOVE_COUNTERSIGNER 可提供候选目标；服务端重新计算目标资格、职责分离、班次和数据范围。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 已发布任务表单允许的字段，例如处理结论、交接清单或会签意见。禁止提交 BPMN 流程变量、目标节点、审批结论外的路由、候选人名单、会签阈值、SLA 时间或授权范围。
    WorkflowTaskActionResult:
      type: object
      additionalProperties: false
      required: [ticket, decision, slaImpact, auditEventId]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        task:
          $ref: '#/components/schemas/WorkflowTask'
          description: 当前主体仍可见的后继或更新任务；任务已结束或无权查看时省略。
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        slaImpact:
          $ref: '#/components/schemas/SlaImpact'
        auditEventId:
          type: string
          maxLength: 128
    TicketInternalCommentRequest:
      type: object
      additionalProperties: false
      required: [version, reason, content, structuredFields]
      x-server-enforced:
        - object-authorization
        - internal-collaboration-permission
        - content-sanitization-and-desensitization
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 评论目的或处理上下文；不得包含密码、令牌或附件正文。
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 纯文本或受限富文本；服务端净化后存储和输出。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 已发布评论模板允许的字段，例如评论类别、处理阶段或交接标记；服务端按模板白名单校验。
    TicketComment:
      type: object
      additionalProperties: false
      required: [id, visibility, author, content, createdAt, auditEventId]
      properties:
        id:
          type: string
          maxLength: 128
        visibility:
          type: string
          const: INTERNAL
        author:
          $ref: '#/components/schemas/IdentitySnapshot'
        content:
          type: string
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          maxLength: 128
    TicketCommentPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ControlledJumpRequest:
      type: object
      additionalProperties: false
      required: [version, reason, sourceTaskId, targetNodeCode, taskDisposition, structuredFields]
      x-server-enforced:
        - object-authorization
        - source-task-and-process-version-check
        - controlled-jump-node-whitelist
        - hard-approval-and-authorization-node-protection
        - dual-approval-policy
        - task-disposition-validation
        - sla-impact-calculation
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: 纠偏、应急或迁移的具体原因；不得以“方便处理”等笼统理由绕过正式流程。
        sourceTaskId:
          type: string
          maxLength: 128
          description: 当前流程任务的候选引用；服务端验证其属于此工单、当前流程实例且当前主体具备操作关系。
        targetNodeCode:
          type: string
          maxLength: 128
          description: 已发布流程定义中允许受控跳转的目标节点编码；服务端拒绝硬审批或授权节点绕过。
        taskDisposition:
          type: string
          enum: [CANCEL_CURRENT_TASKS, PRESERVE_AS_READ_ONLY]
          description: 当前任务处置意图；服务端按节点策略最终决定。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 已发布跳转申请表单定义中的影响范围、回退方案、关联变更单等字段；客户端不能提供审批结论或 SLA 时间。
    ControlledJumpRequestResult:
      type: object
      additionalProperties: false
      required: [requestId, decision, slaImpact]
      properties:
        requestId:
          type: string
          maxLength: 128
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        slaImpact:
          $ref: '#/components/schemas/SlaImpact'
    Ticket:
      type: object
      additionalProperties: false
      required: [id, type, status, priority, title, requester, serviceCatalogItem, createdAt, version]
      properties:
        id:
          type: string
          pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        requester:
          $ref: '#/components/schemas/IdentitySnapshot'
        assignee:
          $ref: '#/components/schemas/IdentitySnapshot'
        serviceCatalogItem:
          $ref: '#/components/schemas/ServiceCatalogSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: 乐观锁版本；写操作须在后续动作契约中携带并校验。
    IdentitySnapshot:
      type: object
      additionalProperties: false
      description: |
        工单事件、审批、分派和审计在发生时固化的身份事实。它不是当前 IAM 投影的外键视图：人员调岗、改名、停用或组织重组后，
        历史记录仍按本快照展示。写入仅由服务端从已校验的 IAM 投影生成，客户端不得提交或修改。
      required: [iamUserId, displayName, organizationName, projectionVersion, capturedAt]
      properties:
        iamUserId:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 100
        organizationName:
          type: string
          maxLength: 200
        iamOrganizationId:
          type: string
          maxLength: 128
        positionName:
          type: string
          maxLength: 200
        iamPositionId:
          type: string
          maxLength: 128
        platformRoles:
          type: array
          maxItems: 20
          description: 事件发生时经服务端计算的角色摘要；仅在该历史记录的可见范围内返回。
          items:
            $ref: '#/components/schemas/PlatformRole'
        projectionVersion:
          type: string
          maxLength: 128
          description: 生成快照所依据的 IAM 投影来源版本/同步批次，用于历史一致性追溯。
        capturedAt:
          type: string
          format: date-time
    ServiceCatalogSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: 稳定问题类型，例如 /problems/validation-failed。
        title:
          type: string
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [VALIDATION_FAILED, DYNAMIC_FORM_VALIDATION_FAILED, CATALOG_NOT_AVAILABLE, RULE_MATCH_NOT_ALLOWED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, INVALID_WORKFLOW_ACTION, INVALID_PROCESS_NODE, APPROVAL_REQUIRED, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        detail:
          type: string
          maxLength: 500
          description: 面向用户的安全摘要；禁止包含 SQL、堆栈、令牌、权限规则或对象敏感信息。
        requestId:
          type: string
          maxLength: 64
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
                maxLength: 200
              code:
                type: string
                maxLength: 80
              message:
                type: string
                maxLength: 300
security:
  - sessionCookie: []
