  /integrations/alerts/events:
    post:
      tags: [Alerts]
      summary: 接收受管监控平台告警事件
      description: |
        仅允许已发布且启用的受管监控连接调用。服务端按固定连接器验证签名、来源网络、时间窗、事件唯一键和请求体摘要；
        禁止把该接口当作通用 webhook、任意 URL 回调、告警/CI 写入代理或内部网络探针。签名失败、来源不匹配、时间超窗、重放、未知字段或连接禁用均拒绝并审计。
      operationId: ingestExternalAlertEvent
      security:
        - integrationCallbackSignature: []
      x-replay-protection: connection-event-id-timestamp-body-digest
      parameters:
        - $ref: '#/components/parameters/IntegrationCallbackTimestamp'
        - $ref: '#/components/parameters/IntegrationCallbackEventId'
        - $ref: '#/components/parameters/IntegrationCallbackSignature'
