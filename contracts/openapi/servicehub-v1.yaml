        version:
          type: integer
          minimum: 0
          description: 仅更新草稿时必填；创建时忽略。服务端拒绝使用该字段覆盖已发布版本。
        reason:
          type: string
          minLength: 4
          maxLength: 500
          description: 变更理由；不得包含收件人地址、端点、密钥、令牌或业务敏感正文。
    NotificationRoutingRulePublishRequest:
      type: object
      additionalProperties: false
