          type: string
          enum: [RECIPIENT_UNAVAILABLE, CHANNEL_DISABLED, POLICY_SUPPRESSED, PROVIDER_REJECTED, RETRY_EXHAUSTED]
          description: 仅最终失败/抑制时返回的通用原因码；不包含供应商响应、目标标识或配置细节。
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
