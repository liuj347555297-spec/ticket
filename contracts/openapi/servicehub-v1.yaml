  /admin/support-queue-idempotency/{idempotencyKey}/reconcile:
    post:
      tags: [SupportQueueAdmin]
      summary: 提交历史队列幂等记录人工对账结论
      description: |
        仅处理 `RECONCILIATION_REQUIRED` 历史记录。申请人提交“确认既有结果”或“最终失败”结论、理由和受控证据引用；
        本操作不补算 HMAC、不重放原业务，也不直接改变最终状态，必须由另一名有权人员复核。未知或无权原 key 统一 404。
        路径 key 仅定位历史记录；请求头 Idempotency-Key 是本次对账命令的独立幂等键。
      operationId: reconcileLegacySupportQueueIdempotency
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      x-replay-protection: subject-method-resource-idempotency-key-and-canonical-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/HistoricalIdempotencyKey'
        - $ref: '#/components/parameters/IdempotencyIfMatch'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliationRequest' }
      responses:
        '202':
          description: 对账结论已提交，等待独立复核；未改变历史业务结果。
          headers:
            Idempotency-Status: { $ref: '#/components/headers/IdempotencyStatus' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/support-queue-idempotency/{idempotencyKey}/reconcile/{reconciliationId}/approve:
    post:
      tags: [SupportQueueAdmin]
      summary: 独立复核历史幂等对账结论
      description: |
        复核人必须不同于申请人，并再次命中原记录的队列管理角色和组织 DATA_SCOPE。通过后只能把历史记录归为
        `LEGACY_RESULT_ONLY` 或 `FAILED_FINAL`；拒绝则保留 `RECONCILIATION_REQUIRED`。不得生成 HMAC、重放原业务或改写旧事件。未知/无权 key 或对账单统一 404。
      operationId: approveLegacySupportQueueIdempotencyReconciliation
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      x-replay-protection: subject-method-resource-idempotency-key-and-canonical-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/HistoricalIdempotencyKey'
        - $ref: '#/components/parameters/SupportQueueIdempotencyReconciliationId'
        - $ref: '#/components/parameters/IdempotencyIfMatch'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliationApprovalRequest' }
      responses:
        '200':
          description: 对账复核已完成，并返回最终或仍需对账状态。
          headers:
            Idempotency-Status: { $ref: '#/components/headers/IdempotencyStatus' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportQueueIdempotencyReconciliation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
