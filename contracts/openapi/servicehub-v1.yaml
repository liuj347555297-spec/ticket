            maxLength: 100
        - name: ticketType
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: categoryCode
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 当前主体可申请的已发布服务目录分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogItemPage'
