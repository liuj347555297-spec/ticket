          pattern: '^SLA-[A-Za-z0-9_-]{8,64}$'
        name:
          type: string
          maxLength: 200
        version:
          type: integer
          minimum: 1
        lifecycleState:
          $ref: '#/components/schemas/SlaConfigurationLifecycleState'
        priority:
          type: integer
          minimum: 1
        matchCriteria:
          $ref: '#/components/schemas/SlaPolicyMatchCriteria'
        workCalendar:
          $ref: '#/components/schemas/SlaWorkCalendarReference'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SlaTargetDefinition'
        pauseConditions:
          type: array
          items:
            $ref: '#/components/schemas/SlaPauseCondition'
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/IdentitySnapshot'
        auditEventId:
          type: string
          maxLength: 128
    SlaPolicyPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SlaPolicy'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    SlaPublicationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 发布申请理由；审批人、发布状态和影响结果均由服务端决定。
    SlaPublicationRequestResult:
      type: object
      additionalProperties: false
      required: [resourceId, version, lifecycleState, approvalTaskId, auditEventId]
      properties:
        resourceId:
          type: string
          maxLength: 128
        version:
          type: integer
          minimum: 1
        lifecycleState:
          type: string
          const: PENDING_REVIEW
        approvalTaskId:
          type: string
          maxLength: 128
          description: 仅作审批任务定位，不能替代对象授权或允许申请人自审。
        auditEventId:
          type: string
          maxLength: 128
    SlaWeeklyWorkingWindow:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        startTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
    SlaWorkCalendarDraftRequest:
      type: object
      additionalProperties: false
      required: [name, version, timeZone, workingWindows, holidays, reason]
      x-server-enforced:
        - sla-configuration-management-scope-check
        - allowed-iana-time-zone-and-dst-validation
        - non-overlapping-working-window-validation
        - immutable-version-and-audit-event
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        version:
          type: integer
          minimum: 0
          description: 新版本创建时服务端据此进行乐观锁；客户端不能指定新版本号或发布状态。
        timeZone:
          type: string
          pattern: '^[A-Za-z]+(?:[_+-][A-Za-z0-9]+)*(?:/[A-Za-z0-9_+.-]+)+$'
          maxLength: 64
          description: 仅允许服务端白名单的 IANA 时区；DST 重复/缺失时间由服务端以确定规则解释并审计。
        workingWindows:
          type: array
          minItems: 1
          maxItems: 21
          items:
            $ref: '#/components/schemas/SlaWeeklyWorkingWindow'
        holidays:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    SlaWorkCalendar:
      type: object
      additionalProperties: false
      required: [id, name, version, lifecycleState, timeZone, workingWindows, holidays, createdAt, auditEventId]
      properties:
        id:
          type: string
          pattern: '^SLACAL-[A-Za-z0-9_-]{8,64}$'
        name:
          type: string
          maxLength: 200
        version:
          type: integer
          minimum: 1
        lifecycleState:
          $ref: '#/components/schemas/SlaConfigurationLifecycleState'
        timeZone:
          type: string
          maxLength: 64
        workingWindows:
          type: array
          items:
            $ref: '#/components/schemas/SlaWeeklyWorkingWindow'
        holidays:
          type: array
          items:
            type: string
            format: date
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/IdentitySnapshot'
        auditEventId:
          type: string
          maxLength: 128
    SlaWorkCalendarPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SlaWorkCalendar'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    TicketSlaTargetStatus:
      type: object
      additionalProperties: false
      required: [targetType, state, targetAt, businessMinutesRemaining]
      properties:
        targetType:
          type: string
          enum: [FIRST_RESPONSE, RESOLUTION]
        state:
          type: string
          enum: [ON_TRACK, AT_RISK, BREACHED, PAUSED, NOT_APPLICABLE]
        targetAt:
          type: string
          format: date-time
        businessMinutesRemaining:
          type: integer
          description: 负数代表已违约；仅由服务端按策略快照与业务日历计算。
        breachedAt:
          type: string
          format: date-time
    TicketSlaStatus:
      type: object
      additionalProperties: false
      required: [ticketId, policySnapshot, calculationTimeZone, calculatedAt, paused, targets]
      properties:
        ticketId:
          type: string
          pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
        policySnapshot:
          type: object
          additionalProperties: false
          required: [policyId, policyVersion, workCalendarId, workCalendarVersion]
          properties:
            policyId:
              type: string
              pattern: '^SLA-[A-Za-z0-9_-]{8,64}$'
            policyVersion:
              type: integer
              minimum: 1
            workCalendarId:
              type: string
              pattern: '^SLACAL-[A-Za-z0-9_-]{8,64}$'
            workCalendarVersion:
              type: integer
              minimum: 1
        calculationTimeZone:
          type: string
          maxLength: 64
        calculatedAt:
          type: string
          format: date-time
        paused:
          type: boolean
        pauseReasonCode:
          type: string
          maxLength: 80
          description: 仅在 paused=true 时返回已授权的受控原因码。
        targets:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TicketSlaTargetStatus'
    ReportMetricDefinition:
      type: object
      additionalProperties: false
      required: [code, name, unit, definition, calculationBasis]
      properties:
        code:
          type: string
          enum: [TICKET_CREATED_COUNT, TICKET_RESOLVED_COUNT, OPEN_TICKET_COUNT, TICKET_STATUS_DISTRIBUTION, TICKET_TYPE_DISTRIBUTION, RESOLUTION_BUSINESS_MINUTES_P50, RESOLUTION_BUSINESS_MINUTES_P90, SLA_RESOLUTION_COMPLIANCE_RATE, SLA_FIRST_RESPONSE_COMPLIANCE_RATE, SLA_AT_RISK_COUNT, SLA_BREACHED_COUNT, BACKLOG_AGING_COUNT]
        name:
          type: string
          maxLength: 120
        unit:
          type: string
          enum: [COUNT, PERCENT, BUSINESS_MINUTES]
        definition:
          type: string
          maxLength: 1000
          description: 固定且可版本化的指标口径，包括分子/分母、状态边界及排除条件；不能由客户端表达式定义。
        calculationBasis:
          type: string
          enum: [EVENT_TIME, RESOLUTION_TIME, SNAPSHOT_TIME]
    ReportMetricDimension:
      type: object
      additionalProperties: false
      properties:
        ticketStatus:
          $ref: '#/components/schemas/TicketStatus'
        ticketType:
          $ref: '#/components/schemas/TicketType'
    ReportMetricValue:
      type: object
      additionalProperties: false
      required: [code, value, availability]
      properties:
        code:
          type: string
          maxLength: 80
        value:
          type: number
        dimension:
          $ref: '#/components/schemas/ReportMetricDimension'
        availability:
          type: string
          enum: [COMPLETE, PARTIAL, NOT_AVAILABLE]
          description: NOT_AVAILABLE 不得以 0 伪造；缺失数据原因见数据新鲜度摘要。
    ReportDataFreshness:
      type: object
      additionalProperties: false
      required: [asOf, aggregationLagSeconds, missingDataStatus]
      properties:
        asOf:
          type: string
          format: date-time
          description: 汇总数据最新覆盖时刻（UTC）。
        aggregationLagSeconds:
          type: integer
          minimum: 0
          description: 当前时间与最新覆盖时刻的滞后秒数；超过服务端阈值时报告应标记 PARTIAL/NOT_AVAILABLE。
        missingDataStatus:
          type: string
          enum: [NONE, PARTIAL, UNAVAILABLE]
        missingBucketCount:
          type: integer
          minimum: 0
        reasonCode:
          type: string
          maxLength: 80
          description: 脱敏原因码，不返回数据库、作业、SQL 或基础设施细节。
    OperationsReportScope:
      type: object
      additionalProperties: false
      required: [effectiveTimeZone, from, to, dataScopeFiltered]
      properties:
        effectiveTimeZone:
          type: string
          maxLength: 64
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        dataScopeFiltered:
          type: boolean
          const: true
        organizationScopeSummary:
          type: string
          maxLength: 200
          description: 已脱敏范围摘要；不返回无权组织层级或完整数据范围。
    OperationsKpiReport:
      type: object
      additionalProperties: false
      required: [scope, metricDefinitions, metrics, freshness]
      properties:
        scope:
          $ref: '#/components/schemas/OperationsReportScope'
        metricDefinitions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReportMetricDefinition'
        metrics:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReportMetricValue'
        freshness:
          $ref: '#/components/schemas/ReportDataFreshness'
    OperationsTrendPoint:
      type: object
      additionalProperties: false
      required: [bucketStart, bucketEnd, availability, metrics]
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketEnd:
          type: string
          format: date-time
        availability:
          type: string
          enum: [COMPLETE, PARTIAL, NOT_AVAILABLE]
        metrics:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReportMetricValue'
    OperationsTrendReport:
      type: object
      additionalProperties: false
      required: [scope, metricDefinitions, granularity, points, freshness]
      properties:
        scope:
          $ref: '#/components/schemas/OperationsReportScope'
        metricDefinitions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReportMetricDefinition'
        granularity:
          type: string
          enum: [HOUR, DAY, WEEK, MONTH]
        points:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/OperationsTrendPoint'
        freshness:
          $ref: '#/components/schemas/ReportDataFreshness'
    OperationsQueueLoadItem:
      type: object
      additionalProperties: false
      required: [queueCode, openTicketCount, pendingAcceptanceCount, atRiskCount, breachedCount]
      properties:
        queueCode:
          type: string
          maxLength: 128
        queueName:
          type: string
          maxLength: 200
        openTicketCount:
          type: integer
          minimum: 0
        pendingAcceptanceCount:
          type: integer
          minimum: 0
        atRiskCount:
          type: integer
          minimum: 0
        breachedCount:
          type: integer
          minimum: 0
    OperationsQueueLoadReport:
      type: object
      additionalProperties: false
      required: [scope, items, freshness]
      properties:
        scope:
          $ref: '#/components/schemas/OperationsReportScope'
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/OperationsQueueLoadItem'
        freshness:
          $ref: '#/components/schemas/ReportDataFreshness'
    ReportRefreshStatus:
      type: object
      additionalProperties: false
      required: [freshness, status]
      properties:
        status:
          type: string
          enum: [CURRENT, LAGGING, PARTIAL, UNAVAILABLE]
        freshness:
          $ref: '#/components/schemas/ReportDataFreshness'
        nextScheduledRefreshAt:
          type: string
          format: date-time
          description: 可选的受控计划摘要；不泄露后台执行节点或任务参数。
    OperationsReportExportRequest:
      type: object
      additionalProperties: false
      required: [reportType, from, to, format, purpose]
      x-server-enforced:
        - real-time-data-scope-filtering
        - secondary-authorization-for-export-cross-organization-or-large-range
        - export-field-row-time-range-watermark-and-retention-policy
        - asynchronous-generation-and-immutable-audit-event
      properties:
        reportType:
          type: string
          enum: [KPI, TREND, QUEUE_LOAD]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timeZone:
          type: string
          maxLength: 64
        organizationIamOrganizationId:
          type: string
          maxLength: 128
          description: 仅可收窄当前数据范围；不允许客户端提交组织列表或跨范围声明。
        includeDescendants:
          type: boolean
          default: false
        format:
          type: string
          enum: [CSV, XLSX]
        purpose:
          type: string
          minLength: 4
          maxLength: 300
        version:
          type: integer
          minimum: 0
          description: 可选导出偏好版本；不是授权、范围或报表版本控制字段。
    OperationsReportExportJob:
      type: object
      additionalProperties: false
      required: [id, reportType, state, requestedAt, requester, expiresAt, auditEventId]
      properties:
        id:
          type: string
          pattern: '^REXP-[A-Za-z0-9_-]{8,64}$'
        reportType:
          type: string
          enum: [KPI, TREND, QUEUE_LOAD]
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED]
        requestedAt:
          type: string
          format: date-time
        requester:
          $ref: '#/components/schemas/IdentitySnapshot'
        expiresAt:
          type: string
          format: date-time
          description: 导出文件受控短期保留；到期后物理清理只能由后台保留策略执行。
        reasonCode:
          type: string
          maxLength: 80
          description: 脱敏状态/失败原因码，不返回 SQL、无权数据或存储位置。
        auditEventId:
          type: string
          maxLength: 128
    BackofficeAccessUpdateRequest:
      type: object
      additionalProperties: false
      required: [enabled, roleCodes, dataScopes, expectedVersion]
      properties:
        enabled:
          type: boolean
          description: 关闭后仅撤销后台能力，不影响普通用户通过 IAM 使用前台建单。
        roleCodes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            enum: [ROLE_FIRST_LINE_SUPPORT, ROLE_SECOND_LINE_SUPPORT, ROLE_APPROVER, ROLE_SERVICE_MANAGER, ROLE_SLA_MANAGER, ROLE_AUDITOR, ROLE_PLATFORM_ADMIN]
        dataScopes:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [scopeType, scopeId]
            properties:
              scopeType:
                type: string
                description: QUEUE 在持久化队列快照交付前不接受新授权；SERVICE 仅兼容历史服务目录编码。
                enum: [ORGANIZATION, SERVICE, SERVICE_CATALOG, SERVICE_SYSTEM, CONFIGURATION_ITEM]
              scopeId:
                type: string
                maxLength: 128
                pattern: '^[A-Za-z0-9._:-]{1,128}$'
        expectedVersion:
          type: integer
          minimum: 0
          description: 后台授权记录乐观锁版本；首次配置为 0。
    BackofficeAccessResponse:
      type: object
      additionalProperties: false
      required: [user, access]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [iamUserId, loginName, displayName, organizationIamId, organizationName]
          properties:
            iamUserId:
              type: string
            loginName:
              type: string
            displayName:
              type: string
            organizationIamId:
              type: string
            organizationName:
              type: string
        access:
          type: object
          additionalProperties: false
          required: [enabled, roleCodes, dataScopes, version]
          properties:
            enabled:
              type: boolean
            roleCodes:
              type: array
              items:
                type: string
            dataScopes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [scopeType, scopeId]
                properties:
                  scopeType:
                    type: string
                  scopeId:
                    type: string
            version:
              type: integer
            updatedAt:
              type: [string, 'null']
              format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: 稳定问题类型，例如 /problems/validation-failed。
        title:
          type: string
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [VALIDATION_FAILED, DYNAMIC_FORM_VALIDATION_FAILED, CATALOG_NOT_AVAILABLE, RULE_MATCH_NOT_ALLOWED, ATTACHMENT_REJECTED, ATTACHMENT_NOT_AVAILABLE, ATTACHMENT_SCAN_UNAVAILABLE, KNOWLEDGE_IMPORT_REJECTED, KNOWLEDGE_DOCUMENT_NOT_AVAILABLE, KNOWLEDGE_PUBLICATION_NOT_ALLOWED, INTEGRATION_CONFIGURATION_NOT_ALLOWED, INTEGRATION_CALLBACK_REJECTED, INTEGRATION_REPLAY_REJECTED, CONFIGURATION_ITEM_NOT_AVAILABLE, ALERT_NOT_AVAILABLE, OBSERVABILITY_LINK_NOT_AVAILABLE, NOTIFICATION_NOT_AVAILABLE, NOTIFICATION_RECIPIENT_NOT_ALLOWED, NOTIFICATION_TEMPLATE_REJECTED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, INVALID_WORKFLOW_ACTION, INVALID_PROCESS_NODE, APPROVAL_REQUIRED, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        detail:
          type: string
          maxLength: 500
          description: 面向用户的安全摘要；禁止包含 SQL、堆栈、令牌、权限规则或对象敏感信息。
        requestId:
          type: string
          maxLength: 64
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
                maxLength: 200
              code:
                type: string
                maxLength: 80
              message:
                type: string
                maxLength: 300
security:
  - sessionCookie: []
