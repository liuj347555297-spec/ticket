      description: 统一返回平台工作流投影、活动任务、协作人员快照、审批申请与服务端计算的可用动作。`controlledJumpActions` 仅会向服务经理或平台管理员返回，且只是显示能力；预演和执行仍在提交时重新执行对象授权、角色、审批、版本与节点校验。读取不授予写权限。
