      required: [processKey, processDefinitionId, processVersion, candidateRoles, decisionMode, timeoutPolicyVersion, escalationPolicyVersion, capturedAt]
      description: 创建审批申请时冻结的流程定义、角色和审批策略证据。具体 IAM 候选集由策略候选、活动 IAM 和申请时对象 DATA_SCOPE 取交集并剔除申请人后冻结，只保存在服务端审计快照，不通过工单详情接口返回。待办读取和决策分别再与当前任务受让关系及当前角色/DATA_SCOPE 取交集；后续发布不改写冻结证据，空集合记录禁止继续审批。
      x-server-enforced:
        - request-time-freeze-after-policy-iam-data-scope-intersection
        - inbox-time-current-task-and-scope-recheck
        - decision-time-current-role-scope-assignee-and-self-review-recheck
        - complete-frozen-candidate-identities-never-returned
