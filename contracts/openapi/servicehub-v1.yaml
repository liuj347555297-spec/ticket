      description: |
        用于受控抢单、释放、完成、委派及会签参与人增减/完成。服务端以 `ticketId`、`taskId`、当前流程实例与定义版本交叉验证，
        再校验候选人/受让人、任务状态、数据范围、审批策略、工单 version 和 taskVersion；客户端不能借此设置流程变量、
        直接审批自己发起的事项、替他人完成任务或改变流程节点。会签数量、完成条件及结束策略仅由已发布 BPMN/服务端规则决定。
