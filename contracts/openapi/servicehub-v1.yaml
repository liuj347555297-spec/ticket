          description: 动作已提交并返回最新工单投影
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow/approval-requests/{requestId}/decisions:
    post:
      tags: [Workflow]
      summary: 对受控跳转 Flowable 审批任务作出决策
      description: 决策时执行第三阶段重算：“冻结候选集 ∩ 当前活动任务受让人 ∩ 当前有效角色/对象 DATA_SCOPE”，并再次拒绝自审；任一不命中即拒绝。服务端先完成独立 Flowable 用户任务，再原子更新审批投影和审计；响应不返回完整冻结候选身份，通过也不等于执行迁移。
      operationId: decideControlledJumpApproval
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowApprovalRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: 独立审批流程已完成，返回审批投影
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpApprovalProjection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow/lifecycle-approval-requests/{requestId}/decisions:
    post:
      tags: [Workflow]
      summary: 对高风险生命周期动作审批作出决策
      description: 适用于挂起、升级、撤销和重开。创建时按“策略候选集 ∩ 活动 IAM ∩ 申请时对象 DATA_SCOPE”冻结候选并剔除申请人；决策时再与当前活动任务受让人、当前角色和 DATA_SCOPE 取交集。审批通过后仅由服务端在版本仍一致时执行，不提供浏览器执行入口，响应不返回完整冻结候选身份。
      operationId: decideLifecycleActionApproval
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowApprovalRequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: 审批决定及服务端执行结果摘要；不返回冻结候选人身份。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleActionApprovalSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow/approval-requests/{requestId}/preflight:
    get:
      tags: [Workflow]
      summary: 只读预演已通过的受控跳转
      description: 仅服务经理或平台管理员可调用。验证审批结论、申请时的工单/流程版本、当前源节点与发布白名单，并返回任务处置、候选人、SLA 和通知重算计划。任何门禁失败均不改变 Flowable、工单、SLA 或通知。
      operationId: preflightControlledJumpExecution
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowApprovalRequestId'
      responses:
        '200':
          description: 预演结论（`executable=false` 仍是正常受控响应）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpPreflight'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/workflow/approval-requests/{requestId}/execute:
    post:
      tags: [Workflow]
      summary: 执行已获批且预演通过的受控跳转
      description: 仅服务经理或平台管理员可调用。服务端以审批申请状态、申请时版本、对象授权和当前节点为门禁，先原子保留执行权，再在同一事务内迁移 Flowable、取消旧任务、创建新投影、重算 SLA/收件人、写入执行结果和审计。重复调用或版本变化返回冲突。
      operationId: executeApprovedControlledJump
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowApprovalRequestId'
        - $ref: '#/components/parameters/WorkflowIfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已执行并返回最新工单投影
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /tickets/{ticketId}/controlled-jump-requests:
    post:
      tags: [Workflow]
      summary: 发起受控流程跳转申请
      description: |
        仅为纠偏、应急或迁移提出申请，绝不直接跳转。服务端验证来源任务、流程定义版本、节点白名单、硬审批/授权节点、
        数据范围、任务处置、审批策略与 SLA 影响；通过后才创建审批和受控执行任务。任何跳转均写入不可篡改审计链。
      operationId: requestControlledTicketJump
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlledJumpRequest'
      responses:
        '202':
          description: 跳转申请已受理；不表示跳转已执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-catalog/items:
