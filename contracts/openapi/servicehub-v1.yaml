          description: 已授权且有效的字典项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-catalog/rule-matches:
    post:
      tags: [RuleMatching]
      summary: 建单前确定性规则案例匹配
      description: |
        只执行已发布的目录、CI、结构化字段、标准标签、错误码和关键词规则，返回可见的已解决案例/知识摘要；
        当前不包含 AI、向量检索、语音、自动处置或自动建单。建议仅供用户参考，不能改变工单路由、优先级、审批或权限。
        服务端以已发布表单重新验证提交字段，忽略客户端声称的匹配分、规则 ID 或案例可见性。
      operationId: matchPreSubmissionRules
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleMatchRequest'
      responses:
        '200':
          description: 当前主体可见的确定性规则建议；空数组表示未匹配，不代表故障不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleMatchResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
