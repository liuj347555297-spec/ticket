            type: string
            maxLength: 64
        - name: formVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fieldCode
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: dependsOn
          in: query
          description: JSON 编码的已允许联动字段值；服务端只读取表单中声明的依赖字段，拒绝未知/敏感字段。
          schema:
            type: string
            maxLength: 2000
      responses:
