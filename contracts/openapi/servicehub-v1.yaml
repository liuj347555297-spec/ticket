        processKey:
          type: string
          maxLength: 128
        processDefinitionId:
          type: string
          maxLength: 128
        processVersion:
          type: integer
          minimum: 0
          description: 0 仅表示历史记录未保存具体流程定义，系统禁止继续审批该记录。
        candidateRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 128
        decisionMode:
          type: string
          enum: [ANY_ONE, ALL_OF]
          description: 仅由服务端部署策略解析并在创建时冻结；ANY_ONE 为任一审批，ALL_OF 为全员会签。
        timeoutPolicyVersion:
          type: string
          maxLength: 128
        escalationPolicyVersion:
          type: string
          maxLength: 128
        capturedAt:
          type: string
          format: date-time
