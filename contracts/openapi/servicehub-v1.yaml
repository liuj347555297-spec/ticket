          format: date-time
        capability:
          type: string
          enum: [IN_APP_DELIVERY, EXTERNAL_IM_DELIVERY]
        configurationVersion:
          type: string
          maxLength: 64
          description: 脱敏的受管配置版本摘要，用于审计和变更比对；不是密钥版本或可用于定位密钥的引用。
        externalCardLinkAuthentication:
