        auditEventId:
          type: string
          maxLength: 128
    NotificationRoutingSnapshot:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        每条 `notification_delivery` 与对应 outbox 投递意图在创建时固化的路由事实；后续规则编辑、组织调整和通道配置变更不得回写。
        仅受控审计/运维链路按最小权限查看，普通收件人投递状态接口不返回本对象。
      required: [resolution, matchedOrganizationIamOrganizationId, event, requestedChannel, resolvedChannel, inAppFallbackEnabled, inAppFallbackApplied, aggregationWindowSeconds, capturedAt]
      properties:
        resolution:
          $ref: '#/components/schemas/NotificationRoutingResolution'
        matchedRuleId:
          type: string
          pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
          description: 仅 PUBLISHED_RULE 或该规则触发 fallback 时保留；系统默认 IN_APP 路由可省略。
        matchedRuleVersion:
          type: integer
          minimum: 0
        matchedOrganizationIamOrganizationId:
          type: string
          maxLength: 128
        includeDescendants:
          type: boolean
        event:
          $ref: '#/components/schemas/NotificationRoutingEvent'
        requestedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        resolvedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        inAppFallbackEnabled:
          type: boolean
        inAppFallbackApplied:
          type: boolean
        aggregationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: 投递创建时使用的去重/聚合窗口快照；规则更新后不得改变历史记录。
        capturedAt:
          type: string
          format: date-time
    NotificationRoutingPreviewMatchedRule:
      type: object
      additionalProperties: false
      required: [id, version, priority, aggregationWindowSeconds, includeDescendants, lifecycleStatus]
      properties:
        id:
          type: string
          pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
        version:
          type: integer
          minimum: 0
        priority:
          type: integer
          minimum: 1
        aggregationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        includeDescendants:
          type: boolean
        lifecycleStatus:
          $ref: '#/components/schemas/NotificationRoutingRuleLifecycleStatus'
    NotificationRoutingPreview:
      type: object
      additionalProperties: false
      description: 脱敏路由计算结果；不解析收件人、不生成实际消息、不泄露外部通道配置，实际投递仍以服务端实时计算并保存快照为准。
      required: [organizationIamOrganizationId, event, resolution, requestedChannel, resolvedChannel, inAppFallbackApplied]
      properties:
        organizationIamOrganizationId:
          type: string
          maxLength: 128
        event:
          $ref: '#/components/schemas/NotificationRoutingEvent'
        resolution:
          $ref: '#/components/schemas/NotificationRoutingResolution'
        requestedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        resolvedChannel:
          $ref: '#/components/schemas/NotificationChannelCode'
        inAppFallbackApplied:
          type: boolean
        matchedRule:
          $ref: '#/components/schemas/NotificationRoutingPreviewMatchedRule'
    WpsImManagedConfiguration:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        仅部署配置/受管密钥服务中的 WPS 企业应用适配器配置模型，绝不作为 API 响应、审计详情或日志输出。
        `secretRef` 只是受管密钥引用，密钥值不得进入数据库或应用配置文件；endpoint 与 platformBaseUrl 由发布的服务端允许列表校验。
      required: [appId, endpoint, secretRef, platformBaseUrl, templateRef]
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 128
          description: WPS 企业应用标识，仅受管适配器配置可读，不能由浏览器/API 客户端提供。
        endpoint:
          type: string
          format: uri
          maxLength: 500
          description: 受控 WPS IM API HTTPS/内网端点；必须匹配服务端允许列表，禁止模板或请求动态覆盖。
        secretRef:
          type: string
          minLength: 1
          maxLength: 256
          x-managed-secret-reference: true
          description: 受管密钥服务或部署环境的引用标识；仅适配器运行时解析，禁止记录/返回明文或可定位路径。
        platformBaseUrl:
          type: string
          format: uri
          maxLength: 500
          description: 受信任工单平台基地址；卡片 targetUrl 只能由该基地址与服务器允许的内部资源相对路径拼接生成。
        templateRef:
          type: string
          minLength: 1
          maxLength: 128
          description: 已发布、受控的 WPS 通知模板版本引用；客户端不得传入模板正文或变量表达式。
    ServerGeneratedPlatformTargetUrl:
      type: string
      format: uri
      maxLength: 1000
      x-server-enforced:
        - trusted-platform-base-url
        - allowed-internal-relative-resource
        - no-token-or-sensitive-query-parameter
      description: |
        仅由服务端根据 WPS 受管 `platformBaseUrl` 与已授权的工单/待办内部相对路径生成。禁止客户端提供、重定向至任意 URL、
        拼接访问令牌/会话/SSO code/密码或透传外部地址；点击后始终进入工单平台认证，SSO 未启用时仍按平台正常认证流程处理。
    ServerGeneratedInternalNavigation:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: |
        外部 IM 卡片的服务端生成内部跳转信息。认证前只保留经签名/绑定会话的内部恢复目标；认证成功后平台仅恢复该允许路径，
        不接受 query、Referer、卡片正文或客户端请求中的任意 returnUrl/redirectUrl。
      required: [internalPath, targetUrl, authenticationRequired, resumeAfterAuthentication]
      properties:
        internalPath:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*$'
          description: 服务端允许列表中的平台内部资源相对路径（如已授权工单/待办）；禁止协议、`..`、反斜杠、查询参数、片段和开放重定向。
        targetUrl:
          $ref: '#/components/schemas/ServerGeneratedPlatformTargetUrl'
        authenticationRequired:
          type: boolean
          const: true
        resumeAfterAuthentication:
          type: boolean
          const: true
    WpsImCardPayload:
      type: object
      additionalProperties: false
      x-internal-only: true
      description: 由服务端固定模板渲染的 WPS 企业应用通知卡片载荷；不能接受客户端正文、模板变量、跳转链接或身份标识。
      required: [appId, templateRef, title, body, navigation]
      properties:
        appId:
