      summary: 只读预览当前已部署生命周期的安全 BPMN XML 与 DI
      description: 不触发部署。原定义无 DI 时仅生成展示坐标；XML 不包含执行扩展或身份配置。
      responses:
        '200':
          description: 展示投影（无已部署定义时明确不可用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowBpmnDiagram' }
        '401': { description: 未认证 }
  /tickets/{ticketId}/workflow/diagram:
    get:
      tags: [Workflow]
      operationId: getTicketInstanceBpmnDiagram
      summary: 经工单对象鉴权读取实例冻结版本的 BPMN 展示投影
      description: 缺少实例定义快照时返回 UNAVAILABLE_LEGACY，绝不以 latest 替代历史。高亮来自该实例的实际引擎活动与历史。
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, pattern: '^TKT-[0-9]{8}-[0-9]{6}$' }
      responses:
        '200':
          description: 冻结定义图或明确遗留不可用状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowBpmnDiagram' }
        '401': { description: 未认证 }
