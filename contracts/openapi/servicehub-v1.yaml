      description: |
        仅用于已发布表单中声明的字典字段。服务端依据字段、目录版本及当前数据范围过滤有效项；
        dictionaryCode 不是授权凭据，未知、未发布或无权字典按防枚举策略处理。不得返回维护备注、内部映射或被禁用值。
      operationId: listPublishedDictionaryEntries
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
