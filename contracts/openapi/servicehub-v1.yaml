    NotificationDelivery:
      type: object
      additionalProperties: false
      description: |
        当前收件人可见的投递状态摘要。一个站内消息可有多个由服务端策略选择的通道投递记录；
        该对象不暴露 outbox 载荷、供应商消息 ID、目标地址、回执正文、重试策略细节或任何受管密钥引用。
      required: [id, channel, state, attemptCount, createdAt]
