        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAlertEvent'
      responses:
        '202':
          description: 告警事件已受控接收或已幂等确认；不表示已关联工单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAlertIngestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
