openapi: 3.1.0
info:
  title: ServiceHub 工单平台 API
  version: 1.0.0-draft.1
  description: |
    Vue 3 门户与 Spring Boot 单体服务的共享 v1 契约。所有业务 API 都由服务端执行对象级、流程动作和数据范围鉴权；UI 隐藏不是授权控制。
    附件上传/下载接口保留为后续独立契约。消息仅通过受控站内信和受管通道适配器投递；不得以通用回调、任意 URL 或客户端指定收件人替代。
servers:
  - url: /api/v1
    description: 同源网关路径
tags:
  - name: System
  - name: Identity
  - name: IdentitySync
  - name: Security
  - name: Tickets
  - name: Workflow
  - name: Collaboration
  - name: Comments
  - name: ServiceCatalog
  - name: ServiceCatalogAdmin
  - name: RuleMatching
  - name: Notifications
  - name: NotificationAdmin
  - name: NotificationRoutingAdmin
paths:
  /health:
    get:
      tags: [System]
      summary: 存活与就绪探针
      description: 仅用于网关/负载均衡探测，不返回版本、依赖地址、堆栈或敏感配置。
      security: []
      responses:
        '200':
          description: 服务可接收流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      summary: 获取当前 IAM 用户及平台投影
      description: |
        返回当前已认证主体的只读 IAM 用户/组织投影及当前授权摘要；不返回密码、IAM 令牌、完整联系方式或组织管理能力。
        平台不创建本地账号、不编辑 IAM 用户或组织；响应仅用于展示，不得替代每次请求的服务端实时授权。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /identity/organizations:
    get:
      tags: [Identity]
      summary: 查询只读组织投影
      description: |
        仅返回当前主体在组织数据范围内可见的 IAM 组织投影。该接口没有创建、更新或删除语义；
        禁止借由父节点、关键词或分页参数枚举越权组织。服务端根据当前主体实时计算可见范围。
      operationId: listOrganizationProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: parentIamOrganizationId
          in: query
          description: 仅作为当前可见范围内的父组织筛选条件；不具备该父组织可见权时按防枚举策略处理。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 组织名称或编码关键词；服务端执行长度限制、转义和数据范围过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读组织投影分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/users:
    get:
      tags: [Identity]
      summary: 查询只读用户投影及候选人摘要
      description: |
        用于分派、审批候选人、消息投递和组织数据权限的只读查询。服务端按调用人数据范围、用途和最小字段集过滤；
        不返回密码、认证令牌或不必要联系方式。不得用此接口创建、编辑、禁用本地用户，亦不得以搜索枚举全量 IAM 人员。
      operationId: listUserProjections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: iamOrganizationId
          in: query
          description: 仅作为当前主体有权访问的组织筛选条件。
          schema:
            type: string
            maxLength: 128
        - name: q
          in: query
          description: 姓名、登录名或工号关键词；服务端最小长度、转义、限流和范围过滤。
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: candidateFor
          in: query
          description: 可选的服务/队列/流程候选人场景；服务端校验调用人是否能查看该场景及被查询人是否有效。
          schema:
            type: string
            maxLength: 128
        - name: includeDisabled
          in: query
          description: 默认不返回停用投影；仅具备 IAM 投影管理权的主体可显式查询。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 当前主体范围内的只读用户/候选人摘要分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/sync-jobs:
    post:
      tags: [IdentitySync]
      summary: 受控触发 IAM 投影同步
      description: |
        仅 `PLATFORM_ADMIN` 或被授予 IAM 投影运维职责的主体可调用。同步连接、凭据、字段映射和增量游标均仅在服务端受管配置中保存；
        请求不接受 IAM 地址、密钥、用户/组织数据或任意脚本。服务端串行/幂等调度、记录来源版本和审计事件，且不会创建本地认证账号。
      operationId: triggerIdentityProjectionSync
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-required-platform-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySyncTriggerRequest'
      responses:
        '202':
          description: 同步任务已被受控受理；不代表数据已同步完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /identity/sync-jobs/{syncJobId}:
    get:
      tags: [IdentitySync]
      summary: 查询 IAM 投影同步状态
      description: |
        仅 `PLATFORM_ADMIN`、IAM 投影运维职责或审计职责可查询。仅返回脱敏的运行摘要、计数、来源版本和审计关联，
        不返回连接串、令牌、原始 IAM 载荷、完整失败记录或个人信息。
      operationId: getIdentityProjectionSyncJob
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/SyncJobId'
      responses:
        '200':
          description: 已授权的同步任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySyncJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /security/csrf:
    get:
      tags: [Security]
      summary: 获取当前会话的 CSRF 令牌
      operationId: getCsrfToken
      responses:
        '200':
          description: 仅对当前会话有效的 CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /security/session:
    delete:
      tags: [Security]
      summary: 注销当前会话
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 会话已失效；重复调用同样视为成功。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets:
    get:
      tags: [Tickets]
      summary: 在当前数据范围内查询工单
      description: 服务端忽略或拒绝越出当前授权范围的组织、队列、人员等筛选条件；不会依赖前端过滤。
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: q
          in: query
          description: 关键词；服务端执行长度限制、转义和权限过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: 已按数据范围过滤的分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Tickets]
      summary: 创建工单
      description: 以当前认证身份作为提单人。requesterId、组织、优先级、队列、状态和处理人均不得由客户端指定。
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: 工单已创建
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: 新工单相对地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: 获取单张工单
      description: 详情、评论、附件及关联信息需逐对象重新授权；无权访问时不得借由错误消息泄露对象存在性。
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 已授权的工单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/actions:
    post:
      tags: [Workflow]
      summary: 执行工单生命周期动作
      description: |
        覆盖提交、分类、分派、受理、开始处理、待用户反馈、解决、关闭、重开、撤销、挂起、恢复和升级。
        客户端仅表达动作意图及结构化业务事实；服务端逐对象校验身份、数据范围、当前状态、流程节点、候选人、审批策略和 SLA 影响，
        并决定是否创建审批任务或拒绝动作。客户端不得指定目标状态、流程变量、审批结论、优先级、队列或处理人。
      operationId: executeTicketAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketActionRequest'
      responses:
        '200':
          description: 动作已立即完成，或已按规则创建后续审批/流程任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/work-actions:
    post:
      tags: [Collaboration]
      summary: 执行转办、协办、抢单、主办指定或交接班
      description: |
        覆盖转办、添加/移除协办、抢单、指定主办与交接班。targetIamUserId 仅是候选目标，
        服务端必须验证该人员 IAM 投影有效、班次/技能/队列/组织数据范围、当前任务候选资格和审批要求；
        不能通过请求体变更提交人、角色、队列、流程受让人或历史身份快照。
      operationId: executeTicketWorkAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketWorkActionRequest'
      responses:
        '200':
          description: 协同关系或任务受让人已更新，或已创建审批任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/workflow-tasks:
    get:
      tags: [Workflow]
      summary: 查询当前主体可操作或可见的 BPMN 任务
      description: |
        仅返回当前工单上、当前主体为受让人/候选人/受限观察者的活动 Flowable 任务；服务端按工单关系、任务可见性、
        流程定义版本和数据范围过滤。任务 ID、流程节点或候选资格只用于定位，绝不构成授权，且不能通过分页枚举其他候选人。
        会签以多实例任务表达：响应只返回当前主体所需的会签进度摘要，不泄露无权参与人的身份或审批意见。
      operationId: listTicketWorkflowTasks
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体可见的活动 BPMN 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/workflow-tasks/{taskId}/actions:
    post:
      tags: [Workflow]
      summary: 执行当前 Flowable 用户任务动作
      description: |
        用于受控抢单、释放、完成、委派及会签参与人增减/完成。服务端以 `ticketId`、`taskId`、当前流程实例与定义版本交叉验证，
        再校验候选人/受让人、任务状态、数据范围、审批策略、工单 version 和 taskVersion；客户端不能借此设置流程变量、
        直接审批自己发起的事项、替他人完成任务或改变流程节点。会签数量、完成条件及结束策略仅由已发布 BPMN/服务端规则决定。
      operationId: executeTicketWorkflowTaskAction
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/WorkflowTaskId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTaskActionRequest'
      responses:
        '200':
          description: 任务动作已完成，或服务端已创建后续任务/审批；响应不暴露未授权候选人。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/internal-comments:
    get:
      tags: [Comments]
      summary: 查询已授权的内部评论
      description: 服务端按工单对象权限、当前协作关系和评论可见范围过滤；提单人及无内部协作权限人员不能据此枚举评论或人员信息。
      operationId: listTicketInternalComments
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体可见的内部评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: 添加内部评论
      description: |
        仅对有当前工单处理关系且具备内部协作权限的人员开放。评论内容服务端净化、脱敏和审计；
        internal 标记由接口固定，不接受客户端将评论公开给提单人或变更工单状态。
      operationId: createTicketInternalComment
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInternalCommentRequest'
      responses:
        '201':
          description: 内部评论已保存并写入审计链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/controlled-jump-requests:
    post:
      tags: [Workflow]
      summary: 发起受控流程跳转申请
      description: |
        仅为纠偏、应急或迁移提出申请，绝不直接跳转。服务端验证来源任务、流程定义版本、节点白名单、硬审批/授权节点、
        数据范围、任务处置、审批策略与 SLA 影响；通过后才创建审批和受控执行任务。任何跳转均写入不可篡改审计链。
      operationId: requestControlledTicketJump
      x-replay-protection: subject-operation-ticket-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlledJumpRequest'
      responses:
        '202':
          description: 跳转申请已受理；不表示跳转已执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /service-catalog/items:
    get:
      tags: [ServiceCatalog]
      summary: 查询当前主体可见的已发布服务目录
      description: |
        仅返回已发布且当前 IAM 身份、组织、服务数据范围可申请的目录项。服务端过滤停用、草稿和无权目录；
        不得以筛选、分页或 ID 探测枚举其他部门服务。目录路由、审批、优先级与 SLA 仅作展示预览，建单时仍由服务端重新计算。
      operationId: listPublishedServiceCatalogItems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ticketType
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: categoryCode
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 当前主体可申请的已发布服务目录分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogItemPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /service-catalog/items/{serviceCatalogItemId}/form:
    get:
      tags: [ServiceCatalog]
      summary: 获取已发布目录项的动态建单表单
      description: |
        返回当前主体可见目录项的不可变已发布版本、字段定义、允许字典和脱敏展示规则；不返回草稿、内部路由条件、脚本或规则表达式。
        前端按此渲染，服务端在建单和规则匹配时以同一已发布版本重新校验字段、联动、数据范围和字典值。
      operationId: getPublishedServiceCatalogForm
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
      responses:
        '200':
          description: 已授权的已发布动态表单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedServiceCatalogForm'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-catalog/dictionaries/{dictionaryCode}/entries:
    get:
      tags: [ServiceCatalog]
      summary: 查询动态表单可用字典项
      description: |
        仅用于已发布表单中声明的字典字段。服务端依据字段、目录版本及当前数据范围过滤有效项；
        dictionaryCode 不是授权凭据，未知、未发布或无权字典按防枚举策略处理。不得返回维护备注、内部映射或被禁用值。
      operationId: listPublishedDictionaryEntries
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
        - name: serviceCatalogItemId
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: formVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fieldCode
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: dependsOn
          in: query
          description: JSON 编码的已允许联动字段值；服务端只读取表单中声明的依赖字段，拒绝未知/敏感字段。
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: 已授权且有效的字典项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /service-catalog/rule-matches:
    post:
      tags: [RuleMatching]
      summary: 建单前确定性规则案例匹配
      description: |
        只执行已发布的目录、CI、结构化字段、标准标签、错误码和关键词规则，返回可见的已解决案例/知识摘要；
        当前不包含 AI、向量检索、语音、自动处置或自动建单。建议仅供用户参考，不能改变工单路由、优先级、审批或权限。
        服务端以已发布表单重新验证提交字段，忽略客户端声称的匹配分、规则 ID 或案例可见性。
      operationId: matchPreSubmissionRules
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleMatchRequest'
      responses:
        '200':
          description: 当前主体可见的确定性规则建议；空数组表示未匹配，不代表故障不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleMatchResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/service-catalog/items:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询当前管理范围内的服务目录草稿和发布版本
      description: 仅服务目录管理职责且具备相应组织/服务数据范围者可见；查询结果不得跨范围泄露草稿、内部规则、候选人或服务配置。
      operationId: listManagedServiceCatalogItems
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ServiceCatalogLifecycleStatus'
      responses:
        '200':
          description: 已按管理数据范围过滤的目录版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItemPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ServiceCatalogAdmin]
      summary: 创建受控服务目录草稿
      description: |
        仅创建草稿；不得以此直接发布或修改其他范围目录。服务端验证管理角色、组织/服务范围、字段规范、字典引用、标签策略和受管规则来源，
        对每次写入固化身份快照、前后摘要和审计链。请求不能携带脚本、表达式、路由执行代码、审批结论或任意候选人名单。
      operationId: createServiceCatalogDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogDraftUpsertRequest'
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/items/{serviceCatalogItemId}:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 获取受控目录草稿或发布版本
      description: 管理接口逐对象验证当前管理数据范围；响应仅返回满足职责所需的配置摘要，敏感路由/审批实现细节须按最小权限脱敏。
      operationId: getManagedServiceCatalogItem
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
      responses:
        '200':
          description: 已授权的管理配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ServiceCatalogAdmin]
      summary: 更新受控服务目录草稿
      description: 只允许更新当前主体管理范围内的草稿，须携带乐观锁版本；发布版本不可原地修改，须复制为新草稿。服务端最终校验字段、字典、标签、规则和数据范围。
      operationId: updateServiceCatalogDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogDraftUpsertRequest'
      responses:
        '200':
          description: 草稿已更新并记录审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedServiceCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/items/{serviceCatalogItemId}/publish-requests:
    post:
      tags: [ServiceCatalogAdmin]
      summary: 提交服务目录发布申请
      description: |
        发布申请不是直接发布。服务端冻结候选草稿版本，重新校验引用字典、字段、联动、标签策略和规则来源，按策略创建复核/审批任务；
        申请人不得审批自己的变更。审批完成前，运行中建单与规则匹配仍只使用最后一份已发布版本。
      operationId: requestServiceCatalogPublication
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogPublishRequest'
      responses:
        '202':
          description: 发布复核/审批已创建；不表示草稿已生效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogPublishRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/dictionaries/{dictionaryCode}:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询受控字典定义及条目
      description: 仅返回当前管理数据范围内的字典；不得借此枚举跨组织服务、内部映射或已删除历史值。
      operationId: getManagedDictionary
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
      responses:
        '200':
          description: 已授权的字典定义
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDictionary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ServiceCatalogAdmin]
      summary: 更新受控字典草稿
      description: |
        字典只允许受控管理者按范围创建或维护草稿；条目编码不可被重用为其他语义，已被发布表单引用的条目不得静默删除或变义。
        服务端校验重复、层级/联动引用、适用范围与版本，并审计前后摘要；字典变更须走发布复核，不能通过前端缓存直接生效。
      operationId: updateManagedDictionaryDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/DictionaryCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedDictionaryUpsertRequest'
      responses:
        '200':
          description: 字典草稿已更新并待受控发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDictionary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-catalog/tags:
    get:
      tags: [ServiceCatalogAdmin]
      summary: 查询标准标签策略
      description: 标准标签仅返回当前主体有权维护或使用的范围；禁止通过标签查询泄露问题、系统、组织或敏感业务名称。
      operationId: listManagedStandardTags
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: 已授权标准标签分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTagPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ServiceCatalogAdmin]
      summary: 创建标准标签草稿
      description: |
        只接受规范化的展示名和受控适用范围；服务端执行 Unicode 规范化、去重、保留词、长度和 XSS/控制字符校验。
        不允许以标签内容注入 HTML、脚本、链接、路由规则、数据范围或用户可见性；发布前需复核和不可篡改审计。
      operationId: createStandardTagDraft
      x-required-platform-roles: [SERVICE_MANAGER, PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardTagUpsertRequest'
      responses:
        '201':
          description: 标准标签草稿已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTag'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /notifications:
    get:
      tags: [Notifications]
      summary: 查询当前主体的站内消息
      description: |
        仅返回以当前认证 IAM 主体为收件人的消息，并按服务端计算的消息可见性、保留期和数据范围再次过滤；
        请求不接受收件人、组织、工单、流程或通道的任意指定条件，不能通过分页或关键词枚举他人消息。
        工单、流程和消息事件中的历史身份快照只用于追溯，当前读取授权仍由服务端基于有效 IAM 投影重新判定。
      operationId: listMyNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: readState
          in: query
          description: 仅筛选当前主体自己的已读状态。
          schema:
            $ref: '#/components/schemas/NotificationReadState'
        - name: category
          in: query
          description: 仅允许筛选当前主体可见的消息类别。
          schema:
            $ref: '#/components/schemas/NotificationCategory'
      responses:
        '200':
          description: 当前主体可见的站内消息分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: 标记当前主体的一条站内消息为已读
      description: |
        仅可标记当前认证主体本人收件箱中的消息；路径 ID 不构成授权，服务端必须在更新前验证收件人 IAM ID、消息可见性和保留状态。
        已读操作以主体、消息、请求指纹和幂等键绑定；重试返回首次结果，不能改变他人的已读状态或消息内容。
      operationId: markMyNotificationRead
      x-replay-protection: subject-operation-notification-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMarkReadRequest'
      responses:
        '200':
          description: 已读状态已由服务端更新并审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: 获取当前主体的未读站内消息数
      description: |
        仅按当前认证 IAM 主体、当前消息可见性和保留策略计算未读数；不接受用户、组织、工单、通道或消息 ID 参数，
        不能用于探测他人消息。结果仅为门户角标提示，不授予读取、标记已读或访问来源工单的权限。
      operationId: getMyUnreadNotificationCount
      responses:
        '200':
          description: 当前主体可见消息的未读计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/{notificationId}/deliveries:
    get:
      tags: [Notifications]
      summary: 查询当前主体消息的投递状态
      description: |
        仅返回当前认证主体作为收件人的脱敏投递摘要。外部通道的原始请求、回执体、URL、令牌、电话号码、WPS/企业微信用户标识及供应商消息 ID 均不得返回。
        outbox 记录、重试和最终失败由服务端异步处理；读取本接口不触发重投，不能根据消息 ID 查询他人或流程候选人的投递结果。
      operationId: listMyNotificationDeliveries
      parameters:
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体自己的脱敏投递状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notification-preferences:
    get:
      tags: [Notifications]
      summary: 查询当前主体的消息通道偏好及强制策略
      description: |
        仅返回当前认证 IAM 主体本人的偏好和服务端计算的有效状态，不接受用户/组织筛选且不能枚举他人偏好或外部 IM 映射。
        `MANDATORY_WORKFLOW_TASK` 等强制待办始终至少经 IN_APP 投递，用户偏好只能影响可选提醒；不能取消、抑制或绕过流程待办、审批和 SLA 强制通知。
      operationId: listMyNotificationPreferences
      responses:
        '200':
          description: 当前主体的偏好及不可退订强制规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notification-preferences/{channelCode}/{category}:
    put:
      tags: [Notifications]
      summary: 更新当前主体的可选消息偏好
      description: |
        仅允许当前主体调整自己的可选消息类别和已受管启用的通道偏好。路径通道/类别只是候选定位；服务端检查当前 IAM 映射、
        通道政策与类别可退订性。强制待办的有效投递状态不可设为禁用，外部地址、收件人、端点和模板均不能通过该接口修改。
      operationId: updateMyNotificationPreference
      x-replay-protection: subject-operation-notification-preference-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/NotificationChannelCode'
        - $ref: '#/components/parameters/NotificationCategory'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceUpdateRequest'
      responses:
        '200':
          description: 偏好已更新；响应中的 effectiveEnabled 是服务端强制策略后的结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/notification-channels:
    get:
      tags: [NotificationAdmin]
      summary: 查询消息通道受管配置状态
      description: |
        仅 `PLATFORM_ADMIN` 或审计职责可查看，且仅返回通道启用状态、适配器健康摘要、受管密钥引用是否可用和最后检查时间。
        不返回密钥名称/值、令牌、证书、代理地址、回调 URL、供应商租户信息、原始错误或收件人映射。
      operationId: listNotificationChannelConfigurationStatus
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      responses:
        '200':
          description: 已授权的消息通道受管配置状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelConfigurationStatusPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/notification-channels/{channelCode}/test-deliveries:
    post:
      tags: [NotificationAdmin]
      summary: 发起受控消息通道测试投递
      description: |
        仅 `PLATFORM_ADMIN` 可在受管通道上创建连通性测试。收件人只能由服务端确定为当前管理员本人或预登记的测试组；
        请求不得传入 IAM 用户、组织、手机号、WPS/企业微信 ID、URL、模板正文、变量、令牌或密钥。测试使用服务端固定、纯文本、无业务数据的模板。
        测试通过 outbox 异步投递，受限频率、幂等、审计和适配器允许列表控制；创建测试不代表外部通道已投递成功。
      operationId: createControlledNotificationChannelTestDelivery
      x-required-platform-roles: [PLATFORM_ADMIN]
      x-replay-protection: subject-operation-channel-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/NotificationChannelCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlledNotificationTestDeliveryRequest'
      responses:
        '202':
          description: 受控测试已写入 outbox 并生成审计；实际投递状态应轮询受限结果摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledNotificationTestDeliveryResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/notification-routing-rules:
    get:
      tags: [NotificationRoutingAdmin]
      summary: 查询组织到消息通道的受控路由规则
      description: |
        仅 `PLATFORM_ADMIN` 或审计职责可按其配置数据范围读取规则摘要。规则只决定已由服务端授权的收件人应使用的通道，
        不创建、扩大或暴露收件人范围；响应不返回外部地址、WPS/企业微信标识、表达式、密钥、端点或原始投递载荷。
        草稿和待复核版本仅对拥有相应管理范围的管理员/审计员可见，读取仍须逐对象校验组织范围以防通过筛选参数枚举组织配置。
      operationId: listNotificationRoutingRules
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: organizationIamOrganizationId
          in: query
          description: 仅作为服务端已授权管理范围内的组织筛选条件；无权组织按防枚举策略处理。
          schema:
            type: string
            maxLength: 128
        - name: lifecycleStatus
          in: query
          schema:
            $ref: '#/components/schemas/NotificationRoutingRuleLifecycleStatus'
      responses:
        '200':
          description: 已按管理范围过滤的路由规则分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingRulePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [NotificationRoutingAdmin]
      summary: 创建消息路由规则草稿
      description: |
        仅 `PLATFORM_ADMIN` 可在自身管理组织范围创建草稿。请求只能定义组织匹配、是否含下级、事件、受控 channelCode、IN_APP fallback、优先级和启用状态；
        不能提交收件人、外部地址、通道端点、WPS/企业微信 ID、模板正文、模板变量、表达式、密钥或直接发布状态。
        服务端校验组织投影、优先级冲突、事件允许列表、通道可用性和职责分离，写入身份快照与不可篡改审计。
      operationId: createNotificationRoutingRuleDraft
      x-required-platform-roles: [PLATFORM_ADMIN]
      x-replay-protection: subject-operation-routing-rule-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRoutingRuleDraftUpsertRequest'
      responses:
        '201':
          description: 路由规则草稿已创建，尚未生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingRule'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/notification-routing-rules/preview:
    get:
      tags: [NotificationRoutingAdmin]
      summary: 预览组织事件的消息通道路由命中
      description: |
        仅 `PLATFORM_ADMIN` 或审计职责可在其管理数据范围内查看脱敏的规则命中结果。预览仅计算组织和事件到通道的路由，
        不查询、生成或返回任何收件人、外部 IM 标识、密钥、端点、模板正文或实际投递；生产投递时仍重新计算且固化路由快照。
      operationId: previewNotificationRouting
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - name: organizationIamOrganizationId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: event
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationRoutingEvent'
      responses:
        '200':
          description: 已授权范围内的脱敏路由预览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/notification-routing-rules/{routingRuleId}:
    get:
      tags: [NotificationRoutingAdmin]
      summary: 获取一条受控消息路由规则
      description: 仅返回当前管理范围内的规则版本；规则 ID 不构成授权，审计员只读且不会因该接口获得组织/通道配置写权。
      operationId: getNotificationRoutingRule
      x-required-platform-roles: [PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/NotificationRoutingRuleId'
      responses:
        '200':
          description: 已授权的路由规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingRule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [NotificationRoutingAdmin]
      summary: 更新消息路由规则草稿
      description: 仅 `PLATFORM_ADMIN` 可修改当前管理范围内的草稿，且必须携带乐观锁版本；已发布版本不可原地修改，须复制为新草稿并再次复核发布。
      operationId: updateNotificationRoutingRuleDraft
      x-required-platform-roles: [PLATFORM_ADMIN]
      x-replay-protection: subject-operation-routing-rule-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/NotificationRoutingRuleId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRoutingRuleDraftUpsertRequest'
      responses:
        '200':
          description: 路由规则草稿已更新并审计，尚未生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingRule'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/notification-routing-rules/{routingRuleId}/publish-requests:
    post:
      tags: [NotificationRoutingAdmin]
      summary: 提交消息路由规则发布申请
      description: |
        发布申请不直接生效。服务端冻结草稿版本，复核组织范围、事件/优先级冲突、通道可用性和 IN_APP fallback，
        创建双人复核/审批；申请人不得审批自己的规则。投递运行时仅使用最后有效的已发布规则。
      operationId: requestNotificationRoutingRulePublication
      x-required-platform-roles: [PLATFORM_ADMIN]
      x-replay-protection: subject-operation-routing-rule-request-fingerprint
      parameters:
        - $ref: '#/components/parameters/NotificationRoutingRuleId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRoutingRulePublishRequest'
      responses:
        '202':
          description: 发布复核/审批已创建；未获批前不会改变投递路由。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingRulePublishRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICEHUB_SESSION
      description: 由 Spring Boot 维护的 HttpOnly、Secure、SameSite 会话 Cookie；浏览器不得将访问令牌写入 localStorage。
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 对所有非安全方法必传；令牌绑定当前会话。
      schema:
        type: string
        minLength: 20
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端为一次写入意图生成的 UUID。服务端将键绑定到认证主体、接口、目标工单/任务和规范化请求指纹；
        同一绑定在受控保留期内仅执行一次并返回原结果，使用相同键但不同指纹必须返回 IDEMPOTENCY_CONFLICT。
        键不可跨主体、工单、任务或操作复用，且服务端记录首次接收时间、结果和审计关联以防重放。
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
    WorkflowTaskId:
      name: taskId
      in: path
      required: true
      description: Flowable 用户任务引用；仅作定位，服务端仍须验证工单、流程实例、当前节点及当前主体的任务关系。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^IAMSYNC-[A-Za-z0-9_-]{8,64}$'
    ServiceCatalogItemId:
      name: serviceCatalogItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^SC-[A-Za-z0-9_-]{3,60}$'
    DictionaryCode:
      name: dictionaryCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{1,62}$'
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 仅作消息定位；服务端必须以当前认证主体为收件人重新执行对象级授权，不能据此读取、标记或枚举其他人的消息。
      schema:
        type: string
        pattern: '^NTF-[A-Za-z0-9_-]{8,64}$'
    NotificationChannelCode:
      name: channelCode
      in: path
      required: true
      description: 仅接受受控适配器允许列表中的通道编码；服务端忽略任何客户端传入的端点、回调、租户或密钥参数。
      schema:
        $ref: '#/components/schemas/NotificationChannelCode'
    NotificationRoutingRuleId:
      name: routingRuleId
      in: path
      required: true
      description: 路由规则定位符；服务端仍须基于当前管理员/审计员的组织配置范围逐对象授权。
      schema:
        type: string
        pattern: '^NRO-[A-Za-z0-9_-]{8,64}$'
    NotificationCategory:
      name: category
      in: path
      required: true
      description: 当前主体可配置的消息类别；是否允许退订由服务端策略决定，强制待办类别不可关闭。
      schema:
        $ref: '#/components/schemas/NotificationCategory'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationFailed:
      description: 请求字段或服务目录规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: 会话不存在、过期或 IAM 身份不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 已认证但不具备当前对象、动作或数据范围权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 对象不存在或按防枚举策略不可见
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等键冲突、状态冲突或乐观锁冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 请求频率超过当前主体或来源限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 服务暂不可接收流量
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [UP]
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          maxLength: 64
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, authorization]
      properties:
        user:
          $ref: '#/components/schemas/UserProjection'
        authorization:
          type: object
          additionalProperties: false
          required: [roles, dataScopes, projectionVersion]
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/PlatformRole'
            dataScopes:
              type: array
              description: 用于 UI 提示，后端仍必须在每次请求实时计算并校验。
              items:
                $ref: '#/components/schemas/DataScopeSummary'
            projectionVersion:
              type: string
              maxLength: 128
              description: 当前 IAM 投影版本，仅用于界面刷新提示；不能作为授权、并发控制或历史身份依据。
    UserProjection:
      type: object
      additionalProperties: false
      required: [iamUserId, displayName, status, organization, positions, candidateSummary, projectionVersion]
      properties:
        iamUserId:
          type: string
          maxLength: 128
          description: IAM 不可变用户标识
        displayName:
          type: string
          maxLength: 100
        loginName:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        organizationPath:
          type: array
          maxItems: 32
          description: 当前归属组织的根至叶路径，仅返回调用人有权查看的节点。
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        positions:
          type: array
          maxItems: 20
          description: IAM 同步的岗位摘要；无岗位时返回空数组，不以本地字段补齐。
          items:
            $ref: '#/components/schemas/PositionSummary'
        candidateSummary:
          $ref: '#/components/schemas/CandidateSummary'
        projectionVersion:
          type: string
          maxLength: 128
          description: 此用户投影的来源版本或成功同步批次；不等同于业务身份快照版本。
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [iamOrganizationId, name]
      properties:
        iamOrganizationId:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
    OrganizationProjection:
      type: object
      additionalProperties: false
      required: [iamOrganizationId, code, name, status, path, projectionVersion]
      properties:
        iamOrganizationId:
          type: string
          maxLength: 128
          description: IAM 不可变组织标识
        code:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
        parentIamOrganizationId:
          type: string
          maxLength: 128
          description: 根组织可省略；服务端仅返回当前范围内可见的父组织引用。
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        path:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        projectionVersion:
          type: string
          maxLength: 128
          description: 来源 IAM 版本或成功同步批次。
        lastSyncedAt:
          type: string
          format: date-time
    OrganizationProjectionPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationProjection'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    PositionSummary:
      type: object
      additionalProperties: false
      required: [iamPositionId, name, status]
      properties:
        iamPositionId:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    CandidateSummary:
      type: object
      additionalProperties: false
      required: [eligible, platformRoles, dataScopes]
      properties:
        eligible:
          type: boolean
          description: 对传入 candidateFor 场景的服务端计算结果；未传场景时表示基础投影可用性，并不授予受让权。
        platformRoles:
          type: array
          maxItems: 20
          description: 当前平台映射角色摘要；仅用于候选提示，执行动作时必须实时复核。
          items:
            $ref: '#/components/schemas/PlatformRole'
        dataScopes:
          type: array
          maxItems: 100
          description: 已脱敏的当前数据范围摘要；服务端不因本字段而放宽对象级授权。
          items:
