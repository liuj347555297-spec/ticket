openapi: 3.1.0
info:
  title: ServiceHub 工单平台 API
  version: 1.0.0-draft.1
  description: |
    Vue 3 门户与 Spring Boot 单体服务的共享 v1 契约。所有业务 API 都由服务端执行对象级、流程动作和数据范围鉴权；UI 隐藏不是授权控制。
    附件与消息通道的上传/下载、投递回执接口保留为后续独立契约：当前版本不得以未受控的通用文件或回调接口替代。
servers:
  - url: /api/v1
    description: 同源网关路径
tags:
  - name: System
  - name: Identity
  - name: Security
  - name: Tickets
  - name: Workflow
  - name: Collaboration
  - name: Comments
paths:
  /health:
    get:
      tags: [System]
      summary: 存活与就绪探针
      description: 仅用于网关/负载均衡探测，不返回版本、依赖地址、堆栈或敏感配置。
      security: []
      responses:
        '200':
          description: 服务可接收流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      summary: 获取当前 IAM 用户及平台投影
      description: 返回只读 IAM 投影；不返回密码、IAM 令牌、完整联系方式或组织管理能力。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /security/csrf:
    get:
      tags: [Security]
      summary: 获取当前会话的 CSRF 令牌
      operationId: getCsrfToken
      responses:
        '200':
          description: 仅对当前会话有效的 CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /security/session:
    delete:
      tags: [Security]
      summary: 注销当前会话
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 会话已失效；重复调用同样视为成功。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets:
    get:
      tags: [Tickets]
      summary: 在当前数据范围内查询工单
      description: 服务端忽略或拒绝越出当前授权范围的组织、队列、人员等筛选条件；不会依赖前端过滤。
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
        - name: q
          in: query
          description: 关键词；服务端执行长度限制、转义和权限过滤。
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: 已按数据范围过滤的分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Tickets]
      summary: 创建工单
      description: 以当前认证身份作为提单人。requesterId、组织、优先级、队列、状态和处理人均不得由客户端指定。
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: 工单已创建
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: 新工单相对地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: 获取单张工单
      description: 详情、评论、附件及关联信息需逐对象重新授权；无权访问时不得借由错误消息泄露对象存在性。
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 已授权的工单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{ticketId}/actions:
    post:
      tags: [Workflow]
      summary: 执行工单生命周期动作
      description: |
        覆盖提交、分类、分派、受理、开始处理、待用户反馈、解决、关闭、重开、撤销、挂起、恢复和升级。
        客户端仅表达动作意图及结构化业务事实；服务端逐对象校验身份、数据范围、当前状态、流程节点、候选人、审批策略和 SLA 影响，
        并决定是否创建审批任务或拒绝动作。客户端不得指定目标状态、流程变量、审批结论、优先级、队列或处理人。
      operationId: executeTicketAction
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketActionRequest'
      responses:
        '200':
          description: 动作已立即完成，或已按规则创建后续审批/流程任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/work-actions:
    post:
      tags: [Collaboration]
      summary: 执行转办、协办、抢单、主办指定或交接班
      description: |
        覆盖转办、添加/移除协办、抢单、指定主办与交接班。targetIamUserId 仅是候选目标，
        服务端必须验证该人员 IAM 投影有效、班次/技能/队列/组织数据范围、当前任务候选资格和审批要求；
        不能通过请求体变更提交人、角色、队列、流程受让人或历史身份快照。
      operationId: executeTicketWorkAction
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketWorkActionRequest'
      responses:
        '200':
          description: 协同关系或任务受让人已更新，或已创建审批任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkActionResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/internal-comments:
    get:
      tags: [Comments]
      summary: 查询已授权的内部评论
      description: 服务端按工单对象权限、当前协作关系和评论可见范围过滤；提单人及无内部协作权限人员不能据此枚举评论或人员信息。
      operationId: listTicketInternalComments
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前主体可见的内部评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: 添加内部评论
      description: |
        仅对有当前工单处理关系且具备内部协作权限的人员开放。评论内容服务端净化、脱敏和审计；
        internal 标记由接口固定，不接受客户端将评论公开给提单人或变更工单状态。
      operationId: createTicketInternalComment
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInternalCommentRequest'
      responses:
        '201':
          description: 内部评论已保存并写入审计链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tickets/{ticketId}/controlled-jump-requests:
    post:
      tags: [Workflow]
      summary: 发起受控流程跳转申请
      description: |
        仅为纠偏、应急或迁移提出申请，绝不直接跳转。服务端验证来源任务、流程定义版本、节点白名单、硬审批/授权节点、
        数据范围、任务处置、审批策略与 SLA 影响；通过后才创建审批和受控执行任务。任何跳转均写入不可篡改审计链。
      operationId: requestControlledTicketJump
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlledJumpRequest'
      responses:
        '202':
          description: 跳转申请已受理；不表示跳转已执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledJumpRequestResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SERVICEHUB_SESSION
      description: 由 Spring Boot 维护的 HttpOnly、Secure、SameSite 会话 Cookie；浏览器不得将访问令牌写入 localStorage。
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 对所有非安全方法必传；令牌绑定当前会话。
      schema:
        type: string
        minLength: 20
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为一次创建意图生成的 UUID；相同主体和键在保留期内只能产生一个结果。
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationFailed:
      description: 请求字段或服务目录规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: 会话不存在、过期或 IAM 身份不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 已认证但不具备当前对象、动作或数据范围权限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 对象不存在或按防枚举策略不可见
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等键冲突、状态冲突或乐观锁冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 请求频率超过当前主体或来源限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 服务暂不可接收流量
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [UP]
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          maxLength: 64
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, authorization]
      properties:
        user:
          $ref: '#/components/schemas/UserProjection'
        authorization:
          type: object
          additionalProperties: false
          required: [roles, dataScopes]
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/PlatformRole'
            dataScopes:
              type: array
              description: 用于 UI 提示，后端仍必须在每次请求实时计算并校验。
              items:
                $ref: '#/components/schemas/DataScopeSummary'
    UserProjection:
      type: object
      additionalProperties: false
      required: [iamUserId, displayName, status, organization]
      properties:
        iamUserId:
          type: string
          maxLength: 128
          description: IAM 不可变用户标识
        displayName:
          type: string
          maxLength: 100
        loginName:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [iamOrganizationId, name]
      properties:
        iamOrganizationId:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 200
    DataScopeSummary:
      type: object
      additionalProperties: false
      required: [scopeType, scopeId]
      properties:
        scopeType:
          type: string
          enum: [ORGANIZATION, SERVICE, QUEUE, CONFIGURATION_ITEM]
        scopeId:
          type: string
          maxLength: 128
    PlatformRole:
      type: string
      enum: [REQUESTER, FIRST_LINE_SUPPORT, SECOND_LINE_SUPPORT, APPROVER, SERVICE_MANAGER, PLATFORM_ADMIN, AUDITOR]
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
    TicketType:
      type: string
      enum: [INCIDENT, SERVICE_REQUEST, ACCESS_REQUEST, PROBLEM, CHANGE]
    TicketStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_CLASSIFICATION, PENDING_ASSIGNMENT, PENDING_ACCEPTANCE, IN_PROGRESS, RESOLVED, PENDING_USER_FEEDBACK, CLOSED, CANCELLED, ON_HOLD]
    TicketAction:
      type: string
      description: 生命周期动作；动作后的状态、优先级、队列、审批和 SLA 均由服务端规则计算。
      enum: [SUBMIT, CLASSIFY, ASSIGN, ACCEPT, START_PROCESSING, REQUEST_USER_FEEDBACK, RESOLVE, CLOSE, REOPEN, CANCEL, HOLD, RESUME, ESCALATE]
    TicketWorkAction:
      type: string
      description: 多人处理动作；目标人员仅是候选输入，不构成授权或直接受让。
      enum: [TRANSFER, ADD_COLLABORATOR, REMOVE_COLLABORATOR, CLAIM, APPOINT_PRIMARY, HANDOVER_SHIFT]
    TicketPriority:
      type: string
      enum: [P1, P2, P3, P4]
    Tag:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          pattern: '^#[^\\s#]{1,50}$'
          description: 自由标签必须以 # 开头；标准标签同样按此格式展示。
        kind:
          type: string
          enum: [STANDARD, FREE]
    TicketCreateRequest:
      type: object
      additionalProperties: false
      required: [serviceCatalogItemId, type, title, description, structuredFields]
      properties:
        serviceCatalogItemId:
          type: string
          maxLength: 64
          description: 服务目录项 ID；后端以此加载必填项、路由、审批与 SLA 规则。
        type:
          $ref: '#/components/schemas/TicketType'
        title:
          type: string
          minLength: 4
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          description: 自然语言补充；服务端清洗、脱敏和长度校验。
        structuredFields:
          type: object
          description: 仅接受服务目录已发布表单定义中的字段；字段类型、必填性和联动规则由服务端验证。
          additionalProperties: true
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Tag'
        relatedConfigurationItemIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
    TicketActionRequest:
      type: object
      additionalProperties: false
      required: [action, version, reason, structuredFields]
      x-server-enforced:
        - object-authorization
        - process-node-and-candidate-check
        - approval-policy
        - workflow-transition
        - sla-impact-calculation
        - immutable-audit-event
      properties:
        action:
          $ref: '#/components/schemas/TicketAction'
        version:
          type: integer
          minimum: 0
          description: 客户端读取到的工单乐观锁版本；不一致时返回 VERSION_CONFLICT，服务端绝不覆盖。
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 必填的操作理由；服务端清洗、脱敏并写入审计摘要。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: |
            仅允许当前服务目录、动作与流程节点已发布定义中的结构化字段，例如分类依据、解决码、挂起原因、升级级别或用户反馈期限。
            禁止传入状态、流程变量、审批人结论、SLA 截止时间、优先级、队列、提交人和处理人；服务端采用字段白名单校验。
    WorkflowDecision:
      type: object
      additionalProperties: false
      required: [outcome, workflowInstanceId, currentNodeCode, auditEventId]
      properties:
        outcome:
          type: string
          enum: [COMPLETED, PENDING_APPROVAL, PENDING_PROCESS_TASK]
          description: 由服务端决策；PENDING_APPROVAL 不表示审批已通过。
        workflowInstanceId:
          type: string
          maxLength: 128
        currentNodeCode:
          type: string
          maxLength: 128
        approvalTaskId:
          type: string
          maxLength: 128
          description: 仅在服务端创建审批任务时返回；ID 不能替代对象级授权。
        auditEventId:
          type: string
          maxLength: 128
    SlaImpact:
      type: object
      additionalProperties: false
      required: [calculatedByServer, impact]
      properties:
        calculatedByServer:
          type: boolean
          const: true
        impact:
          type: string
          enum: [NONE, PAUSED, RESUMED, RECALCULATED, BREACH_RISK]
        targetAt:
          type: string
          format: date-time
          description: 服务端计算后的目标时间；仅在当前主体有查看该 SLA 信息的权限时返回。
    TicketActionResult:
      type: object
      additionalProperties: false
      required: [ticket, decision, slaImpact]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        slaImpact:
          $ref: '#/components/schemas/SlaImpact'
    TicketWorkActionRequest:
      type: object
      additionalProperties: false
      required: [action, version, reason, structuredFields]
      x-server-enforced:
        - object-authorization
        - target-identity-projection-and-skill-check
        - current-task-candidate-check
        - approval-policy
        - workflow-assignment
        - immutable-audit-event
      properties:
        action:
          $ref: '#/components/schemas/TicketWorkAction'
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        targetIamUserId:
          type: string
          maxLength: 128
          description: 转办、增加/移除协办、指定主办或交接班的候选目标；抢单时忽略，服务端以当前主体为候选人。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 仅允许动作定义的班次、技能、交接清单、协办职责等字段；不得传入流程受让人、角色或组织范围。
    TicketParticipant:
      type: object
      additionalProperties: false
      required: [role, identity, assignedAt]
      properties:
        role:
          type: string
          enum: [PRIMARY, COLLABORATOR]
        identity:
          $ref: '#/components/schemas/IdentitySnapshot'
        assignedAt:
          type: string
          format: date-time
    TicketWorkActionResult:
      type: object
      additionalProperties: false
      required: [ticket, decision, participants]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        participants:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TicketParticipant'
    TicketInternalCommentRequest:
      type: object
      additionalProperties: false
      required: [version, reason, content]
      x-server-enforced:
        - object-authorization
        - internal-collaboration-permission
        - content-sanitization-and-desensitization
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 评论目的或处理上下文；不得包含密码、令牌或附件正文。
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 纯文本或受限富文本；服务端净化后存储和输出。
        structuredFields:
          type: object
          additionalProperties: true
          description: 已发布评论模板允许的字段；服务端按模板白名单校验。
    TicketComment:
      type: object
      additionalProperties: false
      required: [id, visibility, author, content, createdAt, auditEventId]
      properties:
        id:
          type: string
          maxLength: 128
        visibility:
          type: string
          const: INTERNAL
        author:
          $ref: '#/components/schemas/IdentitySnapshot'
        content:
          type: string
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          maxLength: 128
    TicketCommentPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ControlledJumpRequest:
      type: object
      additionalProperties: false
      required: [version, reason, sourceTaskId, targetNodeCode, taskDisposition, structuredFields]
      x-server-enforced:
        - object-authorization
        - source-task-and-process-version-check
        - controlled-jump-node-whitelist
        - hard-approval-and-authorization-node-protection
        - dual-approval-policy
        - task-disposition-validation
        - sla-impact-calculation
        - immutable-audit-event
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: 纠偏、应急或迁移的具体原因；不得以“方便处理”等笼统理由绕过正式流程。
        sourceTaskId:
          type: string
          maxLength: 128
          description: 当前流程任务的候选引用；服务端验证其属于此工单、当前流程实例且当前主体具备操作关系。
        targetNodeCode:
          type: string
          maxLength: 128
          description: 已发布流程定义中允许受控跳转的目标节点编码；服务端拒绝硬审批或授权节点绕过。
        taskDisposition:
          type: string
          enum: [CANCEL_CURRENT_TASKS, PRESERVE_AS_READ_ONLY]
          description: 当前任务处置意图；服务端按节点策略最终决定。
        structuredFields:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 已发布跳转申请表单定义中的影响范围、回退方案、关联变更单等字段；客户端不能提供审批结论或 SLA 时间。
    ControlledJumpRequestResult:
      type: object
      additionalProperties: false
      required: [requestId, decision, slaImpact]
      properties:
        requestId:
          type: string
          maxLength: 128
        decision:
          $ref: '#/components/schemas/WorkflowDecision'
        slaImpact:
          $ref: '#/components/schemas/SlaImpact'
    Ticket:
      type: object
      additionalProperties: false
      required: [id, type, status, priority, title, requester, serviceCatalogItem, createdAt, version]
      properties:
        id:
          type: string
          pattern: '^TKT-[0-9]{8}-[0-9]{6}$'
        type:
          $ref: '#/components/schemas/TicketType'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        requester:
          $ref: '#/components/schemas/IdentitySnapshot'
        assignee:
          $ref: '#/components/schemas/IdentitySnapshot'
        serviceCatalogItem:
          $ref: '#/components/schemas/ServiceCatalogSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: 乐观锁版本；写操作须在后续动作契约中携带并校验。
    IdentitySnapshot:
      type: object
      additionalProperties: false
      required: [iamUserId, displayName, organizationName, capturedAt]
      properties:
        iamUserId:
          type: string
          maxLength: 128
        displayName:
          type: string
          maxLength: 100
        organizationName:
          type: string
          maxLength: 200
        positionName:
          type: string
          maxLength: 200
        capturedAt:
          type: string
          format: date-time
    ServiceCatalogSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: 稳定问题类型，例如 /problems/validation-failed。
        title:
          type: string
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, INVALID_WORKFLOW_ACTION, INVALID_PROCESS_NODE, APPROVAL_REQUIRED, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
        detail:
          type: string
          maxLength: 500
          description: 面向用户的安全摘要；禁止包含 SQL、堆栈、令牌、权限规则或对象敏感信息。
        requestId:
          type: string
          maxLength: 64
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
                maxLength: 200
              code:
                type: string
                maxLength: 80
              message:
                type: string
                maxLength: 300
security:
  - sessionCookie: []
