spring:
  application:
    name: servicehub-backend
  # The default profile intentionally has no external database dependency. It keeps the
  # development-only in-memory ticket repository usable until the mysql profile is explicitly set.
  datasource:
    # Do not use H2 MODE=MySQL here: Flowable's H2 DDL uses the native IDENTITY type.
    url: jdbc:h2:mem:servicehub;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jackson:
    deserialization:
      # Fail closed on fields outside a published request DTO. This prevents silently accepting
      # browser-supplied requester, priority, status, queue or assignee fields.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # Transport layer limit mirrors the domain limit; controllers still enforce count/type/content checks.
      max-file-size: 10MB
      max-request-size: 11MB
flowable:
  # The workflow port is backed by a real Flowable 7 engine in every profile.  The async executor
  # is deliberately disabled until job locking/cluster topology is part of the deployment design.
  async-executor-activate: false
  database-schema-update: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
servicehub:
  attachment:
    # Development-only location. Production supplies a mounted, non-web-accessible volume or an object-storage adapter.
    storage-root: ${SERVICEHUB_ATTACHMENT_STORAGE_ROOT:${java.io.tmpdir}/servicehub-attachments}
    max-file-size-bytes: 10485760
    max-files-per-ticket: 10
  security:
    # Must be replaced by the internal portal origin for each deployment environment.
    allowed-origins:
      - http://localhost:5173
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
