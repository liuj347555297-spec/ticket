spring:
  application:
    name: servicehub-backend
  # The default profile intentionally has no external database dependency. It keeps the
  # development-only in-memory ticket repository usable until the mysql profile is explicitly set.
  datasource:
    # Do not use H2 MODE=MySQL here: Flowable's H2 DDL uses the native IDENTITY type.
    url: jdbc:h2:mem:servicehub;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jackson:
    deserialization:
      # Fail closed on fields outside a published request DTO. This prevents silently accepting
      # browser-supplied requester, priority, status, queue or assignee fields.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # Transport layer limit mirrors the domain limit; controllers still enforce count/type/content checks.
      max-file-size: 10MB
      max-request-size: 11MB
flowable:
  # The workflow port is backed by a real Flowable 7 engine in every profile.  The async executor
  # is deliberately disabled until job locking/cluster topology is part of the deployment design.
  async-executor-activate: false
  database-schema-update: true
server:
  servlet:
    session:
      cookie:
        name: SERVICEHUB_SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
servicehub:
  platform-time-zone: ${SERVICEHUB_PLATFORM_TIME_ZONE:Asia/Shanghai}
  local-auth:
    enabled: ${SERVICEHUB_LOCAL_AUTH_ENABLED:false}
    bootstrap-login-name: ${SERVICEHUB_LOCAL_AUTH_BOOTSTRAP_LOGIN:}
    bootstrap-password: ${SERVICEHUB_LOCAL_AUTH_BOOTSTRAP_PASSWORD:}
    bootstrap-display-name: ${SERVICEHUB_LOCAL_AUTH_BOOTSTRAP_DISPLAY_NAME:}
    bootstrap-organization-id: ${SERVICEHUB_LOCAL_AUTH_BOOTSTRAP_ORGANIZATION_ID:}
    bootstrap-organization-name: ${SERVICEHUB_LOCAL_AUTH_BOOTSTRAP_ORGANIZATION_NAME:}
    local-dev-password: ${SERVICEHUB_LOCAL_AUTH_LOCAL_DEV_PASSWORD:}
  iam-sso:
    # Enable only after the internal IAM OIDC client registration, issuer, redirect URI and immutable subject field have been approved.
    enabled: ${SERVICEHUB_IAM_SSO_ENABLED:false}
    iam-user-id-attribute: ${SERVICEHUB_IAM_SSO_SUBJECT_ATTRIBUTE:sub}
  workflow:
    controlled-jump:
      # A deployment-controlled list of target lifecycle nodes that require all frozen approvers.
      # Empty means ANY_ONE; this is never selected by the browser or an API request.
      all-of-target-nodes: ${SERVICEHUB_CONTROLLED_JUMP_ALL_OF_TARGET_NODES:}
  attachment:
    # Development-only location. Production supplies a mounted, non-web-accessible volume or an object-storage adapter.
    storage-root: ${SERVICEHUB_ATTACHMENT_STORAGE_ROOT:${java.io.tmpdir}/servicehub-attachments}
    max-file-size-bytes: 10485760
    max-files-per-ticket: 10
    clamav:
      enabled: ${SERVICEHUB_CLAMAV_ENABLED:false}
      host: ${SERVICEHUB_CLAMAV_HOST:127.0.0.1}
      allowed-hosts: ${SERVICEHUB_CLAMAV_ALLOWED_HOSTS:127.0.0.1}
      port: ${SERVICEHUB_CLAMAV_PORT:3310}
      connect-timeout: ${SERVICEHUB_CLAMAV_CONNECT_TIMEOUT:2s}
      read-timeout: ${SERVICEHUB_CLAMAV_READ_TIMEOUT:5s}
      total-timeout: ${SERVICEHUB_CLAMAV_TOTAL_TIMEOUT:15s}
      chunk-size-bytes: ${SERVICEHUB_CLAMAV_CHUNK_SIZE_BYTES:65536}
      max-response-bytes: ${SERVICEHUB_CLAMAV_MAX_RESPONSE_BYTES:4096}
  notification:
    dispatch:
      batch-size: ${SERVICEHUB_NOTIFICATION_DISPATCH_BATCH_SIZE:20}
      max-attempts: ${SERVICEHUB_NOTIFICATION_DISPATCH_MAX_ATTEMPTS:5}
      retry-base-delay-ms: ${SERVICEHUB_NOTIFICATION_DISPATCH_RETRY_BASE_DELAY_MS:30000}
      delivering-lease-ms: ${SERVICEHUB_NOTIFICATION_DISPATCH_DELIVERING_LEASE_MS:300000}
      fixed-delay-ms: ${SERVICEHUB_NOTIFICATION_DISPATCH_FIXED_DELAY_MS:10000}
    wps-im:
      # This is deployment-owned application metadata, not a browser-editable integration.
      # secret-reference names a secret held by the deployment's managed secret provider; it is
      # never the secret itself. The built-in local resolver intentionally only understands an
      # env:NAME reference. Production should supply a managed-secret resolver bean instead.
      enabled: ${SERVICEHUB_WPS_IM_ENABLED:false}
      app-id: ${SERVICEHUB_WPS_IM_APP_ID:}
      endpoint: ${SERVICEHUB_WPS_IM_ENDPOINT:}
      secret-reference: ${SERVICEHUB_WPS_IM_SECRET_REFERENCE:}
      platform-base-url: ${SERVICEHUB_PLATFORM_BASE_URL:}
      template-ref: ${SERVICEHUB_WPS_IM_TEMPLATE_REF:}
      # Exact HTTPS provider host names. This is an egress allow-list, never a suffix match.
      allowed-hosts: ${SERVICEHUB_WPS_IM_ALLOWED_HOSTS:}
      connect-timeout-ms: ${SERVICEHUB_WPS_IM_CONNECT_TIMEOUT_MS:3000}
      request-timeout-ms: ${SERVICEHUB_WPS_IM_REQUEST_TIMEOUT_MS:5000}
  security:
    # Must be replaced by the internal portal origin for each deployment environment.
    allowed-origins:
      - http://localhost:1525
    # Allows Spring Security test identities and the local preview shell. Production overrides
    # this to false so only the server-created VerifiedIamAuthentication marker is accepted.
    allow-direct-test-identities: true
    dev-header-enabled: ${SERVICEHUB_DEV_HEADER_ENABLED:false}
  ticket:
    pagination:
      cursor-signing-key: ${SERVICEHUB_TICKET_CURSOR_SIGNING_KEY:local-development-only-ticket-cursor-signing-key}
      cursor-ttl: ${SERVICEHUB_TICKET_CURSOR_TTL:15m}
  support-queue:
    idempotency:
      current-key-version: ${SERVICEHUB_SUPPORT_QUEUE_HMAC_CURRENT_VERSION:local-v1}
      key-ring: ${SERVICEHUB_SUPPORT_QUEUE_HMAC_KEY_RING:local-v1=local-development-support-queue-hmac-key-material}
      lease-duration: ${SERVICEHUB_SUPPORT_QUEUE_IDEMPOTENCY_LEASE:2m}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
